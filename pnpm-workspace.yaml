# Supply-chain hardening — see .claude/rules/supply-chain.md (section 1).
# Do NOT relax these without reading that rule first.

# Refuse to resolve packages younger than 7 days (10080 minutes).
# Catches the high-risk window right after a maintainer-account compromise.
minimumReleaseAge: 10080
# Fail loudly when a target version is too new — never silently downgrade.
minimumReleaseAgeStrict: true

# No minimumReleaseAgeExclude entries. The cooldown bypass is this repo's
# primary Shai-Hulud defence; the only entry that ever existed (brace-expansion,
# added 2026-08-01) reached its delete date and was resolved by upstream.

# Default-deny lifecycle scripts. Audit before adding entries here.
allowBuilds:
  # lefthook (Evil Martians) — postinstall resolves the prebuilt Go binary out of
  # the platform-specific optional dep (`lefthook-<os>-<arch>`, pinned to the
  # exact parent version and resolved by pnpm under the same cooldown + registry
  # rules) and runs `lefthook install`. No network access of its own: the whole
  # package contains zero fetch/download code. Required for the git hooks to
  # function. Audited 2026-07-29 against `postinstall.js` + `get-exe.js` @ v2.1.9.
  lefthook: true
  # msw — postinstall is a no-op unless `msw.workerDirectory` is set in our
  # package.json (it isn't; we're Node-only, no browser service worker). The
  # script wraps its body in `.catch(() => void 0)`. Audited 2026-07-29 against
  # `node_modules/msw/config/scripts/postinstall.js` @ v2.14.6.
  msw: true
  # esbuild — pulled in transitively by the dev build tooling (`drizzle-kit` for
  # migration generation, and `tsx` under both drizzle-kit and the VitePress
  # vite). The postinstall script selects the platform-specific binary subpackage
  # (e.g. @esbuild/linux-x64) — a regular npm package pnpm has already resolved
  # with cooldown rules — and falls back to downloading the tarball from
  # registry.npmjs.org over HTTPS, SHA-256-checking the bytes before exec, if the
  # optional dep was skipped. Both paths source from the same registry pnpm
  # already trusts. esbuild has provenance attestation + Sigstore signature.
  # Audited 2026-07-29 against `node_modules/.pnpm/esbuild@0.28.1/node_modules/esbuild/install.js`.
  esbuild: true
  # msgpackr-extract — pulled in transitively by bunqueue (via msgpackr for
  # the queue's binary serialization). The install script is
  # `node-gyp-build-optional-packages`, which looks for a prebuilt binary in
  # platform-specific subpackages (e.g. `@msgpackr-extract/msgpackr-extract-darwin-arm64`)
  # already resolved by pnpm under the same cooldown + registry rules as
  # the parent. Falls back to a local node-gyp build from C++ source if no
  # platform prebuilt is found. Same trust pattern as esbuild/bun above.
  # msgpackr also has a pure-JS fallback if msgpackr-extract is absent;
  # allowing the build just buys the native accelerator. Audited 2026-05-20
  # against `node_modules/.pnpm/msgpackr-extract@3.0.3/node_modules/msgpackr-extract/package.json`.
  msgpackr-extract: true

# Reinforce the v11 default in case it ever changes upstream.
strictDepBuilds: true

# No transitive deps from git URLs or raw tarballs — registry only.
blockExoticSubdeps: true

# Fail install if a newer release has weaker publish-time trust than the prior one.
trustPolicy: no-downgrade

# Re-verify node_modules matches the lockfile before any script runs.
verifyDepsBeforeRun: install

# Transitive-dep overrides. Each entry needs a date + reason — same bar as
# `allowBuilds` above. Keep the path as specific as possible so the override
# disappears the moment the upstream chain is fixed.
#
# THREE entries: the two version workarounds below, re-verified on 2026-09-30
# the only way that proves anything (deleted, reinstalled, audited), plus one
# REMOVAL (`bun-plugin-tailwind>bun`, added 2026-09-30) that forces no version
# at all — it deletes a duplicate toolchain; its own note says why.
# `@esbuild-kit/core-utils>esbuild` brings GHSA-67mh-4wv8-2f99 straight back
# when removed, and dropping `vite` fails the install outright on
# `trustPolicy: no-downgrade` before the audit even runs. So neither is a habit
# nobody rechecked.
#
# The standing bias of this block is that an override is a WORKAROUND, not a
# fix: it is what you write when no installable upgrade reaches a patched
# version, and it is deleted the moment one does. Three passes running, an
# entry has left this list by being resolved upstream rather than by expiring:
#   - `ajv>fast-uri` (removed 2026-09-09) was never needed; ajv's own range
#     already allowed the patched 3.1.6 and the override was only compensating
#     for a stale lockfile. `pnpm update fast-uri --depth Infinity` was the fix.
#   - `react-cosmos>ws`, `react-cosmos>http-proxy-middleware`, `express>qs` and
#     `body-parser>qs` (all removed 2026-09-23) were fixed at the source by
#     react-cosmos 7.4.0 — see the note where they used to sit, below.
#   - The fast-uri pair that reappeared 2026-09-30 (GHSA-qw65-cvwx-89v3,
#     GHSA-58mr-gqgx-xq4g, both high, on `@commitlint/*>ajv>fast-uri@3.1.6`)
#     did NOT get an override: ajv's `^3.0.1` already admits the patched 3.1.8
#     (2026-09-15, past the 7-day gate), so `pnpm update fast-uri --depth
#     Infinity` was the whole fix — the same lesson as the 2026-09-09 entry.
# When you add one, write the condition that deletes it, then check that
# condition on every pass.
overrides:
  # GHSA-67mh-4wv8-2f99 — esbuild <=0.24.2 lets any website hit the dev server
  # via permissive CORS. drizzle-kit ships the deprecated `@esbuild-kit/*`
  # packages which hard-pin esbuild ~0.18.20. We only invoke drizzle-kit for
  # `db:generate` / `db:studio` (no dev-server exposure), so the practical risk
  # is nil — but `pnpm audit --audit-level=moderate` (supply-chain CI job)
  # rejects it. ^0.25.0 dedupes onto the esbuild 0.25.x that drizzle-kit itself
  # already declares (`esbuild ^0.25.4`), so this adds zero new versions —
  # pinning ^0.28.1 here would instead add a third copy for no audit gain, since
  # 0.25.x carries no open advisory. Remove once drizzle-kit drops
  # `@esbuild-kit/*`. Added 2026-05-16, re-verified 2026-09-23 by deleting it
  # and reinstalling: GHSA-67mh-4wv8-2f99 comes straight back on
  # `.>drizzle-kit>@esbuild-kit/esm-loader>@esbuild-kit/core-utils>esbuild`.
  # drizzle-kit 0.31.10 still ships `@esbuild-kit/*`. Note 0.31.11 landed
  # 2026-09-21 and is the first movement on this package since 2026-03-17 —
  # it is two days old, so it is not installable yet. Checked 2026-09-30
  # against the published manifest: 0.31.11 STILL declares
  # `@esbuild-kit/esm-loader ^2.5.5`, so taking it on its 30-day date
  # (2026-10-21) will not retire this entry. Only drizzle-kit's 1.0 line (beta /
  # rc today) is a candidate. Re-verified 2026-09-30 by deletion: the advisory
  # comes straight back. esbuild 0.28.x
  # arrives via tsx/vite and carries no open advisory; raising this entry to
  # it would add a third esbuild copy for no audit gain, which is why it says
  # ^0.25.0 rather than ^0.28.1 (it dedupes onto the 0.25.12 drizzle-kit
  # already resolves — confirmed by `pnpm why esbuild` on 2026-09-23).
  # Re-verified 2026-10-07 by deletion: GHSA-67mh-4wv8-2f99 comes back.
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  # GHSA-fx2h-pf6j-xcff / GHSA-4w7w-66w2-5vf9 / GHSA-v6wh-96g9-6wx3 — vite
  # <=6.4.2 has a `server.fs.deny` bypass via Windows alternate paths, a path
  # traversal in optimized-deps `.map` handling, and (via launch-editor) an
  # NTLMv2 hash disclosure over UNC paths. All three are dev-server-only and the
  # first and third are Windows-only, so none is reachable from our static docs
  # build — but they are patched only in vite >=6.4.3, and vitepress@1.6.4
  # declares `vite ^5.4.14`, so the chain cannot reach a patched version on its
  # own. vite 5.4's bundled esbuild ~0.21.5 additionally trips
  # GHSA-67mh-4wv8-2f99.
  #
  # These four were suppressed via `auditConfig.ignoreGhsas` until 2026-07-29 on
  # the reasoning that vitepress had no stable release off vite 5. That reasoning
  # only ever justified *not moving vitepress*; it did not rule out moving vite
  # underneath it. Forcing vite 7.3.6 (published 2026-06-25, past both the 7-day
  # `minimumReleaseAge` gate and our 30-day proactive-upgrade bar) clears all
  # four advisories outright and lets the ignore list be deleted entirely.
  #
  # This is deliberately OUTSIDE vitepress@1.6.4's declared `vite ^5.4.14` range,
  # so it is verified by build rather than by semver: `pnpm docs:build` renders
  # all 7 pages, and the tag-stripped prose (SHA-256 over the HTML with <script>
  # and <style> removed, so bundler-generated content hashes don't count) is
  # byte-identical to the vite 5.4.21 build. vite 6.4.3 also builds clean; vite
  # 8.1.0 builds but warns that vitepress calls the deprecated
  # `transformWithEsbuild`, which is why this pins the 7.x line, not 8.x.
  # Exact-pinned, not caret: a vite major that vitepress does not sanction must
  # move on a deliberate, re-verified bump, never by drifting on `pnpm update`.
  # Remove once vitepress ships a stable release on vite >=6.4.3 (its 2.x line;
  # only a 2.0.0-alpha exists today). Added 2026-07-29, re-verified 2026-09-23:
  # vitepress is still 1.6.4 (its `next` tag is still 2.0.0-alpha.20, unmoved
  # since the last pass) and 7.3.6 is still the newest 7.x — the line has not
  # moved since 2026-06-25, while `latest` has gone on to 8.3.0. `pnpm
  # docs:build` on this pin renders all 7 pages clean.
  #
  # Second, independent reason this entry is now load-bearing: without it the
  # install does not merely regress the audit, it FAILS. vitepress's own range
  # resolves vite 5.4.21, which trips `trustPolicy: no-downgrade` above —
  # `ERR_PNPM_TRUST_DOWNGRADE ... earlier versions had trusted publisher, but
  # this version has provenance attestation`. So removing this entry would mean
  # relaxing a supply-chain gate, not just accepting an advisory. Re-confirmed
  # 2026-09-23 by deleting the entry: the install still dies on that exact
  # error for vite@5.4.21, before the audit ever runs. Re-confirmed 2026-09-30
  # the same way, same error. vitepress `latest` is still 1.6.4, `next` still
  # 2.0.0-alpha.20, and 7.3.6 is still the newest 7.x (vite `latest` is 8.3.1).
  # Re-confirmed 2026-10-07 by deletion: same ERR_PNPM_TRUST_DOWNGRADE on
  # vite@5.4.21; vitepress is still 1.6.4 / next 2.0.0-alpha.20. vite 7.3.7
  # (and 6.4.4) appeared 2026-10-06 — one day old, no advisory against 7.3.6
  # behind it; eligible for this pin on 2026-11-05, re-verify by docs build.
  vite: "7.3.6"
  # REMOVAL, not a version pin: "-" drops `bun` from bun-plugin-tailwind's
  # dependency set. The plugin declares `bun >=1.0.0` as a peer purely to say
  # "runs under Bun"; `autoInstallPeers` answered it by installing the npm `bun`
  # package, which puts a SECOND bun (1.3.13, the newest the lockfile had seen)
  # at `node_modules/.bin/bun`. pnpm prepends `.bin` to PATH, so every
  # `pnpm test` / `pnpm build` / `pnpm cosmos` ran on 1.3.13 while
  # `.tool-versions`, `setup-bun` in CI and the runtime image all say 1.4.0 —
  # the 2026-09-23 "suite re-run on bun 1.4.0" was in fact on 1.3.13 through
  # `pnpm test`. Found 2026-09-30 by `pnpm exec bun -v`.
  #
  # Why an override and not a setting: `peerDependencyRules.ignoreMissing`
  # still auto-installs (verified in a scratch project), and
  # `autoInstallPeers: false` also drops peers we need at runtime
  # (hono-openapi's `@standard-community/*`). Declaring `bun` ourselves would
  # keep a second binary and add a fourth place the Bun version must agree.
  # Types are unaffected: `import { BunPlugin } from 'bun'` resolves through
  # `@types/bun`. Remove if bun-plugin-tailwind stops declaring the peer, or if
  # pnpm grows a per-package "do not auto-install this peer" switch.
  # Re-verified 2026-10-07 by deletion: pnpm auto-installs npm `bun@1.4.2`
  # and the install then fails on ERR_PNPM_IGNORED_BUILDS (its postinstall is
  # no longer in `allowBuilds`), so the entry is still load-bearing.
  "bun-plugin-tailwind>bun": "-"
  # GHSA-238p-pmpm-9mq7 (low) — katex >=0.11.0 <0.18.2: prototype pollution
  # that already exists elsewhere in the page can bypass katex's `trust`
  # restrictions. Patched only on the 0.18 line (0.18.2, 2026-08-08). mermaid
  # declares `katex ^0.16.47` on every 11.x AND on 12.0.0 / 12.1.0, so no
  # mermaid upgrade reaches a patched katex, and there is no 0.16.x backport.
  # An override is therefore the only fix that is not a suppression.
  #
  # Like `vite` above, this is deliberately OUTSIDE the consumer's range, so it
  # is verified by use rather than by semver. mermaid touches exactly one katex
  # API — `(await import("katex")).default.renderToString(src, { throwOnError,
  # displayMode, output: "mathml" | "htmlAndMathml" })`, and only for `$$…$$`
  # labels (no diagram in docs/ has one). The two breaking changes between
  # 0.16.47 and 0.18.7 are the internal `__defineFunction` API (0.17.0) and
  # prefixed CSS class names (0.18.0); mermaid uses neither. Checked
  # 2026-10-07 by rendering the same expressions through both versions in
  # both output modes and running `pnpm docs:build`. Exact-pinned to the
  # newest 30-day-eligible 0.18.x so it only moves on a re-verified bump.
  # Deleting it brings GHSA-238p-pmpm-9mq7 straight back (katex 0.16.47).
  # Remove once mermaid declares `katex >=0.18.2`. Added 2026-10-07.
  "mermaid>katex": "0.18.7"
  # The four entries that used to sit here — `react-cosmos>ws`,
  # `react-cosmos>http-proxy-middleware`, `express>qs` and `body-parser>qs` —
  # are GONE as of 2026-09-23, resolved at the source rather than expired.
  # They existed because react-cosmos 7.3.0 declared its server-side deps as
  # **exact** versions (`express 4.22.1`, `http-proxy-middleware 3.0.5`,
  # `ws 8.19.0`), and an exact pin means pnpm can never reach a patched
  # release on its own no matter how long we wait. react-cosmos 7.4.0
  # (2026-08-17) moves to `ws 8.21.3`, `http-proxy-middleware 3.0.7` and
  # `express 5.2.1` (whose `qs ^6.14.0` reaches the patched 6.16.0 unaided),
  # which clears all five advisories the four entries were holding down:
  # GHSA-58qx-3vcg-4xpx + GHSA-96hv-2xvq-fx4p (ws), GHSA-gcq2-9pq2-cxqm +
  # GHSA-64mm-vxmg-q3vj (http-proxy-middleware), and GHSA-q8mj-m7cp-5q26 /
  # GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g (qs).
  #
  # Verified 2026-09-23 the same way they were always verified: deleted all
  # four, reinstalled on react-cosmos 7.4.0, and `pnpm audit
  # --audit-level=moderate` reports "No known vulnerabilities found". The
  # resolved tree is `http-proxy-middleware 3.0.7`, `qs 6.16.0`,
  # `express 5.2.1`, and ws at 8.21.3 (react-cosmos) + 8.21.0 (happy-dom).
  # Those are two ws copies where the old exact-pinned override kept one —
  # deliberately not re-added, because both copies are patched and an
  # override with no advisory behind it is exactly the habit this block
  # exists to avoid. `pnpm cosmos` was re-run on 7.4.0 (which carries four
  # internal majors: express 4->5, chokidar 3->5, yargs 17->18, open 10->11)
  # and still serves the playground on :5050 and the renderer on :5051, both
  # 200, with all 11 fixtures discovered.

# VEX-style "not affected" dispositions. ONE entry as of 2026-10-07 (braces,
# reason 2 below). A reason-1 entry for source-map-js GHSA-68fv-2mgg-jv7q was
# added and converted the same day: added at 01:00Z when the fix, 1.2.2, was
# 13 hours short of the 7-day gate, deleted at 14:16Z by taking 1.2.2 with
# `pnpm update source-map-js --depth Infinity` (postcss and @vue/compiler-core
# both declare `^1.2.1`, so no override). That left one 1.2.1 copy behind a
# stale postcss 8.5.24 under vitepress; `pnpm dedupe` collapsed it, removing
# five stale copies (postcss 8.5.24, source-map-js 1.2.1, yargs 18.0.0,
# @vue/shared 3.5.38, type-fest 5.6.0) and adding no new versions.
#
# Reason 1 — the patched release is inside the 7-day `minimumReleaseAge`
# cooldown, so there is no version pnpm is allowed to install that clears the
# finding. Bypassing the cooldown with `minimumReleaseAgeExclude` would be the
# wrong trade — that gate is this repo's primary Shai-Hulud defence (see
# .claude/rules/supply-chain.md) — so for an advisory that is genuinely
# unreachable here, suppressing it for a few days is strictly safer than
# installing a package that is days old. Such an entry names the date it
# converts into a real upgrade; on that date, delete the entry and bump.
#
# Reason 2 (first used 2026-10-07) — NO patched release exists at all: the
# advisory says `patched_versions: null` / `patched_versions_unpublished`, so
# there is nothing to upgrade to and nothing an override could point at. Such
# an entry names the condition that deletes it (upstream publishes a fix) and
# must be re-checked on every pass, because it has no date to expire on.
#
# What is NOT a reason to add an entry: a patched release that is merely younger
# than the 30-day proactive bar. That bar says "upgrade even when the audit is
# green"; it is a floor on staleness, never a ceiling on a security fix. The
# 2026-09-09 pass is the worked example — hono <4.13.5 opened three advisories
# and the fix, 4.13.5, was 14 days old: past the 7-day gate, short of 30. It was
# taken as a real upgrade the same day rather than suppressed. Nor is "the
# consumer's range does not reach the fix": that is what an override is for
# (see `mermaid>katex` above, added the same day as the braces entry).
#
# EVERY ENTRY NEEDS A TWIN in `allow-ghsas` on the dependency-review step of
# .github/workflows/supply-chain.yml, because that action reads GitHub's
# advisory DB directly and never looks at this file. Add and delete in both
# places on the same commit, or `pnpm audit` and the `Supply-chain audit` job
# disagree.
#
# History: every earlier entry was resolved by an upgrade rather than by
# expiry — the fast-uri/hono pair (added 2026-08-04) on 2026-08-11 and the qs
# pair (added 2026-09-03) on 2026-09-06. The list was empty from 2026-09-06
# until 2026-10-07.
auditConfig:
  ignoreGhsas:
    # GHSA-vfj7-8cjw-p6xm (high) — braces <=3.0.3: stack exhaustion when
    # expanding a deeply nested brace PATTERN. Reason 2: braces 3.0.3
    # (2024-09) is the newest release and the advisory lists no patched
    # version (`patched_versions_unpublished`); `git ls-remote --tags
    # https://github.com/micromatch/braces` shows no tag past 3.0.3 either.
    # Nothing to upgrade or override to. NOT AFFECTED:
    #   - Dev-only. Every path is `react-cosmos > micromatch@4.0.8 > braces`
    #     or `react-cosmos > http-proxy-middleware > micromatch > braces`;
    #     react-cosmos is a devDependency and the `--prod` image never has it.
    #     react-cosmos 7.4.1 exact-pins `micromatch 4.0.8` itself.
    #   - Patterns are ours. The DoS needs an attacker-controlled glob.
    #     react-cosmos calls `micromatch(paths, patterns)` in
    #     `findUserModulePaths` with patterns built from cosmos.config.json;
    #     http-proxy-middleware matches request paths against the `httpProxy`
    #     patterns from the same config (we declare none, so it is not even
    #     mounted). A request path is the subject, never the pattern.
    # DELETE when braces publishes a fix: micromatch declares `braces ^3.0.3`,
    # so `pnpm update braces --depth Infinity` then reaches it unaided.
    # Re-check `npm view braces version` every pass. Added 2026-10-07.
    - GHSA-vfj7-8cjw-p6xm

# Deliberate version holds — packages whose newest release is NOT the one
# pinned in package.json. Two different reasons live here, and the entry says
# which: either the release is simply younger than the 30-day proactive bar
# (the ordinary case — not a hold, just the bar), or it is 30-day-eligible and
# we are deliberately NOT taking it because it is broken or wrong for us (a
# real hold). No pnpm setting enforces either, so the note is the only thing
# keeping the pin honest. Each entry names the version and the date it becomes
# installable, so the next audit converts it instead of rediscovering it.
#
# Converted by the 2026-10-07 pass and therefore GONE from this list (cutoff
# for the 30-day bar: published on or before 2026-09-07):
#   - npm, same line: @scalar/hono-api-reference 0.12.1,
#     @tanstack/react-router 1.170.33, bunqueue 2.9.4, lucide-react 1.42.0,
#     @biomejs/biome 2.5.12 (+ `biome.json` $schema via `biome migrate`),
#     happy-dom + @happy-dom/global-registrator 20.14.0, @types/bun 1.4.1,
#     @types/react-dom 19.2.7.
#   - hono 4.13.5 -> 4.13.7: a SECURITY bump as well as a 30-day one —
#     GHSA-hxh3-vqpv-xpqv (moderate, hono/jsx boundary XSS) is patched in
#     4.13.7, which is also the newest hono past the 30-day bar.
#   - hono-openapi 1.3.1 -> 1.3.2, and `@hono/standard-validator` DELETED
#     from package.json, exactly as the previous pass scheduled. 1.3.2 makes
#     it a real dependency at `^0.4.0`, so pnpm now installs 0.4.0 unasked
#     (`pnpm why @hono/standard-validator` -> hono-openapi only). Nothing in
#     `src/` imports it by name; `/openapi.json` is byte-identical to the
#     1.3.1 build (sorted-key diff of both servers' output).
#   - Transitive lockfile refreshes that clear advisories with no override:
#     dompurify 3.4.16, proxy-addr 2.0.8, shell-quote 1.11.0, vue 3.5.43
#     and source-map-js 1.2.2 (taken at 14:16Z once it cleared the 7-day
#     gate) (`pnpm update <pkg> --depth Infinity`; every consumer's range
#     already allowed the fix).
#   - The `/docs` Scalar bundle on jsDelivr (src/server/docs/docs.router.ts):
#     @scalar/api-reference 1.67.0 -> 1.68.0 (2026-09-07). Verified by
#     serving each version's `dist/browser/standalone.js` to /docs in
#     Chromium: same rendered text, same hosts contacted, no page errors.
#   - pnpm 11.25.0 -> 11.26.0, bun 1.4.0 -> 1.4.2, Node 24.20.0 -> 24.21.0 —
#     see their entries below.
#   - GitHub Actions: actions/deploy-pages v5.0.0 -> v5.0.1,
#     docker/setup-qemu-action v4.2.0 -> v4.3.0.
#   - Python: ruff 0.16.5 -> 0.16.6; livekit-agents + livekit-plugins-google
#     1.7.1 -> 1.8.0; SDK uv.lock security refresh (multidict, pyjwt,
#     urllib3).
#
# - The react-router HMR workaround (`development: { hmr: false }` in
#   src/server/main.ts) is STILL NEEDED on 1.170.33. Re-checked 2026-10-07 by
#   flipping it to `hmr: true` and loading `/` in Chromium under
#   `bun --hot`: same "Cannot read properties of null (reading
#   'replaceRouteChunk')" from @tanstack/router-core 1.171.28, on bun 1.4.2.
#   With HMR off the SPA loads with no console errors, and `pnpm cosmos`
#   renders a fixture. Re-check the same way on every react-router bump.
#
# - pnpm, taken 11.25.0 -> 11.26.0 (2026-09-06) on 2026-10-07. Pinned in
#   THREE places that must move together, or corepack and the Dockerfile
#   disagree about what runs:
#     package.json#packageManager, .tool-versions, Dockerfile.dev.server
#   (the Dockerfile cannot read `packageManager` before the COPY, so it spells
#   the version out — supply-chain.md §1). 11.27.0 (2026-09-12) becomes
#   eligible 2026-10-12. Take the newest eligible 11.x each pass. pnpm 12.x is
#   a MAJOR and is NOT taken on the date bar alone — `engines.pnpm`
