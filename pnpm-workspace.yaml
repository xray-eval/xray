# Supply-chain hardening — see .claude/rules/supply-chain.md (section 1).
# Do NOT relax these without reading that rule first.

# Refuse to resolve packages younger than 7 days (10080 minutes).
# Catches the high-risk window right after a maintainer-account compromise.
minimumReleaseAge: 10080
# Fail loudly when a target version is too new — never silently downgrade.
minimumReleaseAgeStrict: true

# No minimumReleaseAgeExclude entries. The cooldown bypass is this repo's
# primary Shai-Hulud defence; the only entry that ever existed (brace-expansion,
# added 2026-08-01) reached its delete date and was resolved by upstream.

# Default-deny lifecycle scripts. Audit before adding entries here.
allowBuilds:
  # lefthook (Evil Martians) — postinstall resolves the prebuilt Go binary out of
  # the platform-specific optional dep (`lefthook-<os>-<arch>`, pinned to the
  # exact parent version and resolved by pnpm under the same cooldown + registry
  # rules) and runs `lefthook install`. No network access of its own: the whole
  # package contains zero fetch/download code. Required for the git hooks to
  # function. Audited 2026-07-29 against `postinstall.js` + `get-exe.js` @ v2.1.9.
  lefthook: true
  # esbuild — pulled in transitively by the dev build tooling (`drizzle-kit` for
  # migration generation, and `tsx` under both drizzle-kit and the VitePress
  # vite). The postinstall script selects the platform-specific binary subpackage
  # (e.g. @esbuild/linux-x64) — a regular npm package pnpm has already resolved
  # with cooldown rules — and falls back to downloading the tarball from
  # registry.npmjs.org over HTTPS, SHA-256-checking the bytes before exec, if the
  # optional dep was skipped. Both paths source from the same registry pnpm
  # already trusts. esbuild has provenance attestation + Sigstore signature.
  # Audited 2026-07-29 against `node_modules/.pnpm/esbuild@0.28.1/node_modules/esbuild/install.js`.
  esbuild: true
  # msgpackr-extract — pulled in transitively by bunqueue (via msgpackr for
  # the queue's binary serialization). The install script is
  # `node-gyp-build-optional-packages`, which looks for a prebuilt binary in
  # platform-specific subpackages (e.g. `@msgpackr-extract/msgpackr-extract-darwin-arm64`)
  # already resolved by pnpm under the same cooldown + registry rules as
  # the parent. Falls back to a local node-gyp build from C++ source if no
  # platform prebuilt is found. Same trust pattern as esbuild/bun above.
  # msgpackr also has a pure-JS fallback if msgpackr-extract is absent;
  # allowing the build just buys the native accelerator. Audited 2026-05-20
  # against `node_modules/.pnpm/msgpackr-extract@3.0.3/node_modules/msgpackr-extract/package.json`.
  msgpackr-extract: true

# Reinforce pnpm's default in case it ever changes upstream.
strictDepBuilds: true

# No transitive deps from git URLs or raw tarballs — registry only.
blockExoticSubdeps: true

# Fail install if a newer release has weaker publish-time trust than the prior one.
trustPolicy: no-downgrade

# Re-verify node_modules matches the lockfile before any script runs.
verifyDepsBeforeRun: install

# Transitive-dep overrides. Each entry needs a date + reason — same bar as
# `allowBuilds` above — and the condition that deletes it. An override is a
# WORKAROUND: what you write when no installable upgrade reaches a patched
# version, deleted the moment one does (every past entry left this list by an
# upstream fix, not by expiring — see git log). Re-verify each entry on every
# pass the only way that proves anything: delete it, reinstall, audit.
#
# Keep each entry's note SHORT — at most ~20 comment lines. pnpm 12's YAML
# parser rejects a mapping whose FIRST entry is preceded by more than 32
# consecutive comment lines ("too many consecutive comments before resolving
# collection entry"), and any entry becomes the first one the day the entries
# above it are retired. Found 2026-10-14, when deleting the esbuild entry
# merged its note into vite's and pnpm refused to read this file at all.
overrides:
  # GHSA-67mh-4wv8-2f99 — esbuild <=0.24.2 serves its dev server with
  # permissive CORS. drizzle-kit 0.31.x ships the deprecated `@esbuild-kit/*`
  # packages, which hard-pin esbuild ~0.18.20. We only run drizzle-kit for
  # `db:generate` / `db:studio` (no dev-server exposure), so the practical risk
  # is nil, but `pnpm audit --audit-level=moderate` rejects it. ^0.25.0
  # dedupes onto the esbuild 0.25.x drizzle-kit already declares, so it adds no
  # new copy (0.25.x has no open advisory). Added 2026-05-16; re-verified
  # 2026-10-14 by deletion on pnpm 12. DELETE when drizzle-kit drops
  # `@esbuild-kit/*`: 0.31.11 still declares `@esbuild-kit/esm-loader`, so only
  # the drizzle-kit 1.0 line (rc today) can retire it.
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  # GHSA-fx2h-pf6j-xcff / GHSA-4w7w-66w2-5vf9 / GHSA-v6wh-96g9-6wx3 /
  # GHSA-93m4-6634-74q7 — dev-server-only vite advisories, patched only in
  # vite >=6.4.3; vitepress 1.6.4 declares `vite ^5.4.14` (and vite 5.4's
  # esbuild ~0.21.5 trips GHSA-67mh-4wv8-2f99 too). Outside vitepress's range
  # on purpose, so it is verified by build, not semver: `pnpm docs:build`
  # renders every page. Exact-pinned so a vite major never drifts in.
  # NOT vite 8: Rolldown ignores vitepress 1.6.4's bundle mutation ("This
  # plugin assigns to bundle variable ... not supported by Rolldown"), so the
  # build emits no `*.md.*.lean.js` chunks while every page's HTML still
  # references them — a broken site that builds green (checked 2026-10-14 on
  # 8.3.3). Added 2026-07-29; re-verified 2026-10-14 by deletion on pnpm 12:
  # the four advisories come back (pnpm 12's `trustPolicy` now falls back to
  # the newest non-downgrade 5.4.x instead of failing as pnpm 11 did). DELETE
  # once vitepress ships a stable release on vite >=6.4.3 (its 2.x line).
  vite: "7.3.6"
  # REMOVAL, not a version pin: bun-plugin-tailwind declares `bun >=1.0.0` as
  # a peer purely to say "runs under Bun", and `autoInstallPeers` answers it
  # with the npm `bun` package — a SECOND bun at `node_modules/.bin/bun`,
  # which pnpm puts first on PATH, so `pnpm test` / `pnpm build` silently ran
  # on a different Bun than `.tool-versions`. `peerDependencyRules` still
  # auto-installs, and `autoInstallPeers: false` also drops peers we need
  # (hono-openapi's `@standard-community/*`). `pnpm exec bun -v` must print
  # the `.tool-versions` version. Added 2026-09-30; re-verified 2026-10-14 on
  # pnpm 12 (see the holds notes). DELETE if bun-plugin-tailwind stops
  # declaring the peer (still 0.1.2) or pnpm grows a per-peer opt-out.
  "bun-plugin-tailwind>bun": "-"
  # GHSA-238p-pmpm-9mq7 (low) — katex <0.18.2 lets pre-existing prototype
  # pollution bypass `trust`. mermaid 12.1.0 still declares `katex ^0.16.47`
  # and there is no 0.16.x backport, so an override is the only non-suppressing
  # fix. Outside mermaid's range on purpose, so it is verified by use: mermaid
  # calls one API, `renderToString(src, { throwOnError, displayMode, output:
  # "mathml" | "htmlAndMathml" })`, and 0.19.0's output for that call is
  # byte-identical to 0.18.7's (checked 2026-10-14, 9 expressions x both
  # modes; 0.19's one breaking change is `strict` reporting, which mermaid
  # does not set). Added 2026-10-07; re-verified 2026-10-14 by deletion.
  # DELETE once mermaid declares a range that admits >=0.18.2 and let it
  # resolve unaided — 12.2.0 (2026-10-13) declares `katex ^0.18.0`.
  "mermaid>katex": "0.19.0"

# VEX-style "not affected" dispositions, for an advisory with NO installable
# fix. Two reasons qualify. (1) The patched release is inside the 7-day
# `minimumReleaseAge` gate: bypassing that gate is the wrong trade, so the
# entry names the date it converts into an upgrade. (2) No patched release
# exists at all (`patched_versions: null`): the entry names the upstream
# event that deletes it and is re-checked every pass. A fix that is merely
# younger than the 30-day bar is NOT a reason — that bar is a floor on
# staleness, never a ceiling on a security fix — and neither is "the
# consumer's range does not reach it": that is what an override is for.
#
# EVERY ENTRY NEEDS A TWIN in `allow-ghsas` on the dependency-review step of
# .github/workflows/supply-chain.yml, which reads GitHub's advisory DB and
# never this file. Add and delete in both places in the same commit.
auditConfig:
  ignoreGhsas:
    # GHSA-vfj7-8cjw-p6xm (high) — braces <=3.0.3: stack exhaustion expanding
    # a deeply nested brace PATTERN. Reason 2: 3.0.3 (2024-05) is the newest
    # release and the advisory lists no patched version. NOT AFFECTED: every
    # path is `react-cosmos > micromatch@4.0.8 > braces` (react-cosmos 7.4.1
    # exact-pins micromatch), a devDependency the `--prod` image never has, and
    # the patterns are ours — react-cosmos globs from cosmos.config.json, and
    # a request path is only ever the subject, never the pattern. Added
    # 2026-10-07; re-checked 2026-10-14 (`npm view braces version` is 3.0.3,
    # npm's bulk advisory endpoint still reports `<=3.0.3`, no fix). DELETE
    # when braces publishes a fix: micromatch's `^3.0.3` then reaches it.
    - GHSA-vfj7-8cjw-p6xm

# Deliberate version holds — packages whose newest release is NOT the one
# pinned in package.json. Either the release is younger than the 30-day
# proactive bar (not a hold, just the bar), or it is eligible and we are
# deliberately not taking it (a real hold, with the reason). No pnpm setting
# enforces either, so this note is the only thing keeping the pins honest.
# Each line names the date the FIRST newer release becomes eligible — take the
# newest eligible one on the day. Previous passes' conversions are in git log.
#
# - npm, current line (as of 2026-10-14):
#     hono 4.13.8 -> 2026-10-15
#     @tanstack/react-router 1.170.37 -> 10-16 (see the HMR note below)
#     @tanstack/react-query 5.103.0 -> 10-16  @scalar/hono-api-reference 0.12.2 -> 10-16
#     @biomejs/biome 2.5.14 -> 10-16          lucide-react 1.47.0 -> 10-17
#     @commitlint/* 21.2.3 -> 10-19           drizzle-orm / drizzle-kit 0.45.3 / 0.31.11 -> 10-21
#     lefthook 2.1.15 -> 10-29                bunqueue 2.9.6 -> 10-31
#     radix-ui 1.7.0 -> 11-04 (a minor)       vite 7.3.7 -> 11-05 (the override; docs build)
#     hono-openapi 1.3.4 -> 11-06             wavesurfer.js 8.0.2 -> 11-06
#     happy-dom (+registrator) 20.14.6 -> 11-07  ky 2.2.0 -> 11-08 (a minor)
#     pnpm 12.11.0 -> 11-08 (packageManager + .tool-versions + Dockerfile.dev.server)
#     msw 3.0.3 -> 11-09                      @types/bun 1.4.3 -> 11-11
#     ts-pattern 5.9.1 -> 11-12               mermaid 12.2.0 -> 11-12 (retires `mermaid>katex`)
#     @mswjs/interceptors 0.45.8 -> 11-12 (keep equal to what msw resolves)
#     Scalar `/docs` bundle (src/server/docs/docs.router.ts) 1.69.0 -> 10-16
#
# - Majors. Taken 2026-10-14: msw 3, wavesurfer.js 8, mermaid 12, pnpm 12,
#   katex 0.19 (override), actions/cache v6, actions/checkout v7,
#   actions/setup-node v7, astral-sh/setup-uv v10, protobuf 7 (SDK lock).
#   Not taken, and why:
#     happy-dom 21 — 21.0.0/21.0.1 (2026-10-11/12) are inside the 7-day gate;
#       installable 2026-10-19.
#     vite 8 — breaks vitepress 1.6.4 (see the `vite` override).
#     drizzle-orm / drizzle-kit 1.0 — release candidates only.
#     multidict 7 (SDK lock) — needs aiohttp >=3.14.5 (2026-10-11), inside
#       the 7-day gate; installable 2026-10-18.
#     Node 26 — not an LTS line yet; supply-chain.md §1 pins `.nvmrc` to LTS.
#
# - msw 3 under Bun: `setupServer` (msw/node) intercepts at the node:net layer,
#   which Bun's native fetch bypasses, so src/test-server.ts builds the network
#   msw's maintainers recommend for Bun (`defineNetwork` + the web
#   FetchInterceptor, mswjs/msw#2811). `src/test-server.test.ts` fails if an
#   unmocked request ever reaches the network again.
#
# - The react-router HMR workaround (`development: { hmr: false }` in
#   src/server/main.ts) is STILL NEEDED: Bun's dev server links modules in one
#   phase, so in an import cycle the importer still on the stack sees a `null`
#   namespace (oven-sh/bun#40248, fix in PR #40259, unmerged), and
#   @tanstack/router-core's router.js <-> load-client.js cycle reads one at top
#   level. Still broken on bun 1.4.3 and 1.4.4-canary.1. TanStack/router#8586
#   (unmerged) breaks the cycle; applied by hand to router-core 1.171.30 it
#   makes `hmr: true` load AND hot-swap an edit without a reload (checked
#   2026-10-14). Delete the workaround when either PR ships in a version we pin.
#
# - pnpm 12 (taken 2026-10-14, 12.10.1) is a native binary: corepack fetches
#   it from registry.npmjs.org on first run, signature-verified by pnpm's own
#   `get-pnpm`. Dockerfile.dev.server pre-fetches it into COREPACK_HOME at
#   build time. 12.x checks `trustPolicy` by resolving the newest
#   NON-downgrading version rather than failing, so a trust downgrade no
#   longer breaks an install — it silently resolves older.
#
# - bun stays 1.4.2: 1.4.3 (2026-10-10) is eligible 2026-11-09.
#   `.tool-versions` plus the `oven/bun:1.4.2-debian` digest
#   (`sha256:4f6e31d1…`) in `Dockerfile` + `Dockerfile.dev.server`.
#
# - Node 24.21.0 is the newest 24.x. Both Dockerfiles pin the tags' current
#   digests (2026-10-06 rebuilds): bookworm-slim `sha256:d6aa754f…`,
#   bookworm `sha256:3d27e5c1…`.
#
# - python base image for the two example Dockerfiles: `3.12.13-slim-bookworm`
#   (`sha256:4766d8b5…`). 3.12.14 (`sha256:392307d2…`, 2026-09-19) is
#   eligible 2026-10-19 — a security-only branch, so take it early if its CVE
#   list reaches the example agents; move `.python-version` / `.tool-versions`
#   with it.
#
# - livekit/livekit-server (examples/livekit-voice-agent/compose.yaml) at
#   v1.13.7 (`sha256:6fd3b708…`); v1.13.8 (2026-10-06) is eligible 2026-11-05.
#   Nothing in CI runs the example; bumps are verified by starting it against
#   `livekit.yaml` and `livekit.live.yaml`.
#
# - GitHub Actions: every `uses:` is SHA-pinned (supply-chain.md §4) and moves
#   on the same bar per action; checked mechanically with `git ls-remote
#   --tags` (SHA match) and `git clone --depth 1 --branch <tag>` + `git log -1
#   --format=%cI` (date). Held: docker/setup-qemu-action v4.4.0,
#   docker/build-push-action v7.4.0, docker/setup-buildx-action v4.4.0 ->
#   2026-10-15 (v4.4.1 -> 10-16); anchore/sbom-action v0.24.3 -> 11-01;
#   step-security/harden-runner v2.22.0 -> 11-04 (v2.22.1 -> 11-06);
#   actions/upload-artifact v7.0.2 -> 11-06; actions/setup-node v7.1.0 and
#   astral-sh/setup-uv v10.3.0 (both inside the 7-day gate on 2026-10-14).
#
# - gitleaks (.github/workflows/secret-scan.yml) 8.30.1 is the newest release.
#
# - Python. Example pins (`examples/livekit-voice-agent/*`) must match between
#   each slice's Dockerfile and pyproject.toml (supply-chain.md §6): held
#   livekit-agents 1.8.2+ and langfuse 4.16.0+ (younger than the bar). SDK:
#   ruff 0.17.0 (2026-10-09) is a rule-promoting minor, eligible 2026-11-08.
#   Scan `uv.lock` every pass via the PyPI JSON API (`/pypi/<pkg>/<ver>/json`
#   -> `vulnerabilities`); clean on 2026-10-14. uv has no release-age gate:
#   check every version a re-lock moves, as `uv lock --upgrade-package` can
#   drag in transitive bumps (it pulled the 3-day-old aiohttp 3.14.5 for
#   multidict 7 on 2026-10-14, which is why multidict 7 was not taken).
