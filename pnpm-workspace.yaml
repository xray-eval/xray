# Supply-chain hardening — see .claude/rules/supply-chain.md (section 1).
# Do NOT relax these without reading that rule first.

# Refuse to resolve packages younger than 7 days (10080 minutes).
# Catches the high-risk window right after a maintainer-account compromise.
minimumReleaseAge: 10080
# Fail loudly when a target version is too new — never silently downgrade.
minimumReleaseAgeStrict: true

# No minimumReleaseAgeExclude entries. The cooldown bypass is this repo's
# primary Shai-Hulud defence; the only entry that ever existed (brace-expansion,
# added 2026-08-01) reached its delete date and was resolved by upstream.

# Default-deny lifecycle scripts. Audit before adding entries here.
allowBuilds:
  # lefthook (Evil Martians) — postinstall resolves the prebuilt Go binary out of
  # the platform-specific optional dep (`lefthook-<os>-<arch>`, pinned to the
  # exact parent version and resolved by pnpm under the same cooldown + registry
  # rules) and runs `lefthook install`. No network access of its own: the whole
  # package contains zero fetch/download code. Required for the git hooks to
  # function. Audited 2026-07-29 against `postinstall.js` + `get-exe.js` @ v2.1.9.
  lefthook: true
  # msw — postinstall is a no-op unless `msw.workerDirectory` is set in our
  # package.json (it isn't; we're Node-only, no browser service worker). The
  # script wraps its body in `.catch(() => void 0)`. Audited 2026-07-29 against
  # `node_modules/msw/config/scripts/postinstall.js` @ v2.14.6.
  msw: true
  # esbuild — pulled in transitively by the dev build tooling (`drizzle-kit` for
  # migration generation, and `tsx` under both drizzle-kit and the VitePress
  # vite). The postinstall script selects the platform-specific binary subpackage
  # (e.g. @esbuild/linux-x64) — a regular npm package pnpm has already resolved
  # with cooldown rules — and falls back to downloading the tarball from
  # registry.npmjs.org over HTTPS, SHA-256-checking the bytes before exec, if the
  # optional dep was skipped. Both paths source from the same registry pnpm
  # already trusts. esbuild has provenance attestation + Sigstore signature.
  # Audited 2026-07-29 against `node_modules/.pnpm/esbuild@0.28.1/node_modules/esbuild/install.js`.
  esbuild: true
  # bun — pulled in as a peer of `bun-plugin-tailwind` (the Tailwind v4
  # plugin for Bun's HTML bundler). The npm `bun` package is *only* installed
  # to satisfy that peer; at runtime everything uses the system bun on
  # PATH. The postinstall (`install.js`) loads the platform-specific binary
  # subpackage `@oven/bun-<platform>-<arch>` (already resolved by pnpm with
  # cooldown rules), or falls back to `registry.npmjs.org/@oven/<pkg>/-/<pkg>-1.3.13.tgz`
  # over HTTPS — same registry/trust boundary pnpm already enforces. Same
  # pattern as esbuild above. Without this, the system `bun` errors at
  # startup when it detects an incomplete `node_modules/bun` sibling.
  # Audited 2026-05-16 against
  # `node_modules/.pnpm/bun@1.3.13/node_modules/bun/install.js`.
  bun: true
  # msgpackr-extract — pulled in transitively by bunqueue (via msgpackr for
  # the queue's binary serialization). The install script is
  # `node-gyp-build-optional-packages`, which looks for a prebuilt binary in
  # platform-specific subpackages (e.g. `@msgpackr-extract/msgpackr-extract-darwin-arm64`)
  # already resolved by pnpm under the same cooldown + registry rules as
  # the parent. Falls back to a local node-gyp build from C++ source if no
  # platform prebuilt is found. Same trust pattern as esbuild/bun above.
  # msgpackr also has a pure-JS fallback if msgpackr-extract is absent;
  # allowing the build just buys the native accelerator. Audited 2026-05-20
  # against `node_modules/.pnpm/msgpackr-extract@3.0.3/node_modules/msgpackr-extract/package.json`.
  msgpackr-extract: true

# Reinforce the v11 default in case it ever changes upstream.
strictDepBuilds: true

# No transitive deps from git URLs or raw tarballs — registry only.
blockExoticSubdeps: true

# Fail install if a newer release has weaker publish-time trust than the prior one.
trustPolicy: no-downgrade

# Re-verify node_modules matches the lockfile before any script runs.
verifyDepsBeforeRun: install

# Transitive-dep overrides. Each entry needs a date + reason — same bar as
# `allowBuilds` above. Keep the path as specific as possible so the override
# disappears the moment the upstream chain is fixed.
#
# THIS LIST IS DOWN TO TWO ENTRIES, from six. The 2026-09-16 pass deleted four
# of them (the whole react-cosmos cluster: `react-cosmos>ws`,
# `react-cosmos>http-proxy-middleware`, `express>qs`, `body-parser>qs`) by
# taking react-cosmos 7.4.0, which fixes all five of their advisories upstream.
# The note where they used to sit records what went and why. An override
# deleted at the source is the only kind of override cleanup that counts;
# deleting one while the advisory is still live just moves the problem into
# `pnpm audit`.
#
# Both survivors were re-verified on 2026-09-16 by checking the upstream
# condition that justifies them, not by re-reading this comment: drizzle-kit is
# still 0.31.10 and still ships `@esbuild-kit/*`, and vitepress is still 1.6.4
# and still declares `vite ^5.4.14`. Neither chain can reach a patched version
# on its own, so neither entry is a habit nobody rechecked. Each entry's own
# note carries the detail.
#
# Two earlier deletions, kept here because the REASON generalises:
#
# - `ajv>fast-uri: 3.1.6` (added 2026-09-03, removed 2026-09-09). ajv 8.20.0
#   declares `fast-uri: ^3.0.1` and the patched floor was 3.1.6 — inside that
#   range all along. The override was only ever compensating for a committed
#   lockfile that still pinned 3.1.4, and pnpm does not re-resolve an entry
#   that already satisfies its range. `pnpm update <pkg> --depth Infinity` is
#   the fix for a stale-but-in-range lockfile pin, NOT an override. Check for
#   this shape first: it is the cheapest override to never add.
#
# - `express>qs` / `body-parser>qs` (removed 2026-09-16). Same lesson from the
#   other direction — once the parent moved (express 4 -> 5), the declared
#   ranges reached the patched version unaided and both entries were pure
#   residue. When an override's parent gets upgraded, re-test the override
#   rather than carrying it across the bump.
overrides:
  # GHSA-67mh-4wv8-2f99 — esbuild <=0.24.2 lets any website hit the dev server
  # via permissive CORS. drizzle-kit ships the deprecated `@esbuild-kit/*`
  # packages which hard-pin esbuild ~0.18.20. We only invoke drizzle-kit for
  # `db:generate` / `db:studio` (no dev-server exposure), so the practical risk
  # is nil — but `pnpm audit --audit-level=moderate` (supply-chain CI job)
  # rejects it. ^0.25.0 dedupes onto the esbuild 0.25.x that drizzle-kit itself
  # already declares (`esbuild ^0.25.4`), so this adds zero new versions —
  # pinning ^0.28.1 here would instead add a third copy for no audit gain, since
  # 0.25.x carries no open advisory. Remove once drizzle-kit drops
  # `@esbuild-kit/*`. Added 2026-05-16, re-verified 2026-09-16 (drizzle-kit
  # 0.31.10 is STILL the newest stable release — unchanged since 2026-03-17, and
  # the only newer tags are 1.0.0-rc/beta prereleases that are not installable
  # under our pins — and it still declares `@esbuild-kit/esm-loader`). esbuild
  # 0.28.2 (2026-08-08) is 30-day-eligible, but it arrives via tsx/vite as
  # 0.28.x and carries no open advisory; raising this entry to it would add a
  # third esbuild copy for no audit gain, which is the same reason it says
  # ^0.25.0 rather than ^0.28.1. `pnpm why esbuild` on 2026-09-16 confirms the
  # intended two copies and no more: 0.25.12 (this override) and 0.28.1
  # (tsx/vite).
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  # GHSA-fx2h-pf6j-xcff / GHSA-4w7w-66w2-5vf9 / GHSA-v6wh-96g9-6wx3 — vite
  # <=6.4.2 has a `server.fs.deny` bypass via Windows alternate paths, a path
  # traversal in optimized-deps `.map` handling, and (via launch-editor) an
  # NTLMv2 hash disclosure over UNC paths. All three are dev-server-only and the
  # first and third are Windows-only, so none is reachable from our static docs
  # build — but they are patched only in vite >=6.4.3, and vitepress@1.6.4
  # declares `vite ^5.4.14`, so the chain cannot reach a patched version on its
  # own. vite 5.4's bundled esbuild ~0.21.5 additionally trips
  # GHSA-67mh-4wv8-2f99.
  #
  # These four were suppressed via `auditConfig.ignoreGhsas` until 2026-07-29 on
  # the reasoning that vitepress had no stable release off vite 5. That reasoning
  # only ever justified *not moving vitepress*; it did not rule out moving vite
  # underneath it. Forcing vite 7.3.6 (published 2026-06-25, past both the 7-day
  # `minimumReleaseAge` gate and our 30-day proactive-upgrade bar) clears all
  # four advisories outright and lets the ignore list be deleted entirely.
  #
  # This is deliberately OUTSIDE vitepress@1.6.4's declared `vite ^5.4.14` range,
  # so it is verified by build rather than by semver: `pnpm docs:build` renders
  # all 7 pages, and the tag-stripped prose (SHA-256 over the HTML with <script>
  # and <style> removed, so bundler-generated content hashes don't count) is
  # byte-identical to the vite 5.4.21 build. vite 6.4.3 also builds clean; vite
  # 8.1.0 builds but warns that vitepress calls the deprecated
  # `transformWithEsbuild`, which is why this pins the 7.x line, not 8.x.
  # Exact-pinned, not caret: a vite major that vitepress does not sanction must
  # move on a deliberate, re-verified bump, never by drifting on `pnpm update`.
  # Remove once vitepress ships a stable release on vite >=6.4.3 (its 2.x line;
  # only a 2.0.0-alpha exists today). Added 2026-07-29, re-verified 2026-09-16:
  # vitepress is still 1.6.4 (unchanged since 2025-08-05; its `next` tag is
  # still 2.0.0-alpha.20, so the alpha has not moved in a week either) and
  # 7.3.6 is still the newest 7.x — the line has not moved since 2026-06-25,
  # while `latest` has gone on to 8.3.0. `pnpm docs:build` on 2026-09-16 renders
  # all 7 pages (index, quickstart, integrate, architecture, sdk-python,
  # wire-contract, 404) and exits 0.
  #
  # Second, independent reason this entry is now load-bearing: without it the
  # install does not merely regress the audit, it FAILS. vitepress's own range
  # resolves vite 5.4.21, which trips `trustPolicy: no-downgrade` above —
  # `ERR_PNPM_TRUST_DOWNGRADE ... earlier versions had trusted publisher, but
  # this version has provenance attestation`. So removing this entry would mean
  # relaxing a supply-chain gate, not just accepting an advisory.
  vite: "7.3.6"
  # NOTHING BELOW THIS LINE. Four entries used to live here and all four are
  # gone as of 2026-09-16, resolved at the source rather than by expiry:
  # `react-cosmos>http-proxy-middleware` (^3.0.7), `react-cosmos>ws` (8.21.0),
  # `express>qs` (6.16.0) and `body-parser>qs` (6.16.0). They existed because
  # react-cosmos 7.3.0 declared its server-side deps as EXACT versions
  # (`express: 4.22.1`, `http-proxy-middleware: 3.0.5`, `ws: 8.19.0`), which
  # pnpm can never upgrade past no matter how long the wait, so five advisories
  # (GHSA-58qx-3vcg-4xpx + GHSA-96hv-2xvq-fx4p on ws, GHSA-gcq2-9pq2-cxqm +
  # GHSA-64mm-vxmg-q3vj on http-proxy-middleware, GHSA-q8mj-m7cp-5q26 on qs,
  # plus GHSA-x5fp-wj9c-mxmx + GHSA-4mjr-xmp4-gh2g on the two qs copies) had no
  # installable fix.
  #
  # react-cosmos 7.4.0 (2026-08-17) fixes every one of them upstream: `ws
  # 8.21.3`, `http-proxy-middleware 3.0.7`, `express 5.2.1`. express 5 declares
  # `qs ^6.14.0` and its `body-parser ^2.2.1` resolves 2.3.0 with `qs ^6.15.2`,
  # so BOTH qs copies reach the patched 6.16.x through ordinary ranges — which
  # is why the two qs overrides went with the other two rather than surviving
  # the bump. Taken on 2026-09-16, the date the 30-day bar cleared, exactly as
  # the version-holds note below scheduled it.
  #
  # Verified the only way that proves anything: bumped, reinstalled, and `pnpm
  # audit --audit-level=moderate` is clean with all four entries absent. `pnpm
  # why` confirms the tree resolves http-proxy-middleware 3.0.7, qs 6.16.0
  # (one copy), express 5.2.1 and body-parser 2.3.0 through ordinary ranges.
  #
  # One deliberate non-goal: `ws` is now TWO copies, 8.21.0 (happy-dom) and
  # 8.21.3 (react-cosmos), where the deleted exact pin forced one. That is the
  # correct trade and not a regression — the pin only ever existed to clear two
  # advisories, both of which 8.21.3 clears on its own, and neither 8.21.0 nor
  # 8.21.3 carries an open advisory. Re-adding an override to re-dedupe them
  # would be tree tidiness bought with a permanent config entry, which is the
  # trade this whole section exists to refuse.

# VEX-style "not affected" dispositions. THE LIST IS EMPTY, and the note below
# is the standing policy for the day it isn't.
#
# There is exactly ONE structural reason an entry may be added here, and it is
# not "we'd rather not upgrade": the patched release is inside the 7-day
# `minimumReleaseAge` cooldown, so there is no version pnpm is allowed to
# install that clears the finding. Bypassing the cooldown with
# `minimumReleaseAgeExclude` would be the wrong trade — that gate is this repo's
# primary Shai-Hulud defence (see .claude/rules/supply-chain.md) — so for an
# advisory that is genuinely unreachable here, suppressing it for a few days is
# strictly safer than installing a package that is days old. Every entry names
# the date it converts into a real upgrade; on that date, delete the entry and
# bump. Do not let one outlive its date.
#
# What is NOT a reason to add an entry: a patched release that is merely younger
# than the 30-day proactive bar. That bar says "upgrade even when the audit is
# green"; it is a floor on staleness, never a ceiling on a security fix. The
# 2026-09-09 pass is the worked example — hono <4.13.5 opened three advisories
# and the fix, 4.13.5, was 14 days old: past the 7-day gate, short of 30. It was
# taken as a real upgrade the same day rather than suppressed.
#
# Every entry this file has ever carried is gone, each resolved by an upgrade
# rather than by expiry: the fast-uri/hono pair (added 2026-08-04) on
# 2026-08-11, and the qs pair (GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g, added
# 2026-09-03) on 2026-09-06 by bumping the `express>qs` override to "6.16.0".
# The 2026-09-16 pass went one better and deleted the `express>qs` override
# itself — see the overrides note above. The list has now been empty for 49
# days and no finding in that window has needed it, which is the outcome this
# policy is aiming at: an empty suppression list maintained by upgrading, not
# an empty one maintained by luck.
#
# If an entry ever comes back: EVERY ENTRY NEEDS A TWIN in `allow-ghsas` on the
# dependency-review step of .github/workflows/supply-chain.yml, because that
# action reads GitHub's advisory DB directly and never looks at this file. Add
# and delete in both places on the same commit, or `pnpm audit` and the
# `Supply-chain audit` job disagree.

# Deliberate version holds and the 30-day bar — the state of every pin this
# repo controls, as of the 2026-09-16 audit pass.
#
# Two different things live here and the distinction matters. A HOLD is a pin
# whose newest 30-day-eligible release is NOT what package.json says, because
# that release is broken or unsanctioned for us; nothing but this note keeps it
# honest. A BAR WAIT is the ordinary case — the newest release simply is not 30
# days old yet — and it needs no justification, only a date. Labelling a bar
# wait as a hold is how a list like this rots into "we never upgrade anything".
#
# What the 2026-09-16 pass TOOK (all verified, see the PR body):
#   react-cosmos / -core / -dom  7.3.0 -> 7.4.0   (deletes FOUR overrides)
#   @biomejs/biome               2.5.7 -> 2.5.9
#   @commitlint/cli              21.2.1 -> 21.2.2
#   @commitlint/config-conventional 21.2.0 -> 21.2.2
#   @scalar/hono-api-reference   0.11.13 -> 0.11.14
#   @tanstack/react-router       1.170.25 -> 1.170.29
#   step-security/harden-runner  v2.20.1 -> v2.21.0
#   docker/setup-buildx-action   v4.2.0 -> v4.3.0
#   sounddevice                  0.5.5 -> 0.5.6   (sdk/python, [live] extra)
#   ruff                         0.16.2 -> 0.16.3 (sdk/python, [dev] extra)
#   livekit-agents               1.6.9 -> 1.6.10  (example agent, both files)
#   livekit-plugins-google       1.6.9 -> 1.6.10  (example agent, both files)
#   langfuse                     4.14.3 -> 4.14.4 (example agent, both files)
#
# `biome.json`'s `$schema` moved 2.5.7 -> 2.5.9 with the binary. It is not a
# dependency, but biome emits a `deserialize` info and points at `biome migrate`
# when the two disagree, so they bump together or `pnpm check` gets noisy.
#
# --- HOLDS (a real reason beyond the date) -----------------------------------
#
# - @hono/standard-validator, held at 0.2.3 (re-verified 2026-09-16). NOT
#   date-gated: 0.4.0 (2026-08-05) clears the 30-day bar, but `hono-openapi`
#   1.3.1 declares `@hono/standard-validator ^0.2.0` as an optional peer, so
#   anything from 0.3.0 up leaves the range its only consumer sanctions.
#   Nothing in `src/` imports this package by name; it is a direct dependency
#   purely because `hono-openapi/dist/index.js` statically imports `sValidator`
#   from it and an *optional* peer is not installed unless we declare it. The
#   0.3.0 diff is types-only (it stops defining `InferInput` locally and
#   re-exports hono's, which is why its peer floor moved to `hono >=4.11.2`);
#   `sValidator` itself is unchanged. So the upgrade buys nothing we consume
#   and costs a peer-range violation.
#
#   The exit is a DELETION, not a bump, and it is confirmed against the
#   registry rather than assumed: hono-openapi 1.3.2 lists
#   `"@hono/standard-validator": "^0.4.0"` in `dependencies` and no longer
#   carries it in `peerDependencies` at all (1.3.1 has it as a peer at
#   `^0.2.0`; 1.3.2 has a real `dependencies` block and a `peerDependencies`
#   of just `{"hono":"^4.11.2"}`). Once hono-openapi depends on it directly,
#   pnpm installs it unasked at a version hono-openapi itself sanctions, and
#   our declaration becomes a second pin on someone else's dependency.
#   ON 2026-10-06: BUMP hono-openapi TO 1.3.2 AND DELETE THE
#   `@hono/standard-validator` ENTRY FROM package.json's `dependencies`.
#   (1.3.3 is 2026-09-13, eligible 2026-10-13 — take the newest eligible on
#   the day.) Verify with `pnpm why @hono/standard-validator` (it must still
#   be present, as hono-openapi's own dep) plus a `pnpm typecheck` — nothing
#   imports it by name, so a green typecheck is the whole proof.
#
# - GitHub Action MAJORS are held on purpose, not on the date bar.
#   actions/cache v6.1.0, actions/checkout v7.0.1, actions/setup-node v7.0.0
#   and astral-sh/setup-uv v10.1.0 are all 30-day-eligible and all stay on the
#   current major until someone reviews the major's changelog deliberately.
#   That matches how this repo has always moved actions (v5.0.5 -> v5.1.0,
#   never v5 -> v6); note actions/cache and actions/checkout both still ship
#   backport releases on the current major, so staying put is not going stale.
#
# --- BAR WAITS (eligible on the date shown, nothing else needed) -------------
#
# npm:
#   @biomejs/biome            2.5.9  -> 2.5.10 2026-09-20, 2.5.11 2026-09-26,
#                                       2.5.12 2026-10-03, 2.5.13 2026-10-10
#   @tanstack/react-router    1.170.29 -> 1.170.30 2026-09-17 (… 1.170.36
#                                       2026-10-13) — this one ages in the day
#                                       after this pass; it is a bar wait, not
#                                       a miss
#   @scalar/hono-api-reference 0.11.14 -> 0.12.0 2026-09-27, 0.12.1 2026-10-07
#                                       (a minor; read the changelog, the
#                                       0.11 -> 0.12 line is not a patch)
#   hono                      4.13.5 -> 4.13.6/4.13.7 2026-10-04,
#                                       4.13.8 2026-10-15
#   react-cosmos              7.4.0  -> 7.4.1 2026-09-30 (react-cosmos only;
#                                       -core / -dom have no 7.4.1, so taking
#                                       it splits the trio's patch level. Fine
#                                       — their ranges are `^7.4.0` — but keep
#                                       the three on the same MINOR.)
#   Everything else in package.json was newest-eligible on 2026-09-16.
#
# PyPI (bar checked against `https://pypi.org/pypi/<pkg>/json` upload_time):
#   ruff                      0.16.3 -> 0.16.4+ per its own dates; 0.16.7 is
#                                       2026-09-10, eligible 2026-10-10. A ruff
#                                       MINOR promotes new lint rules into the
#                                       default set and turns green code red, so
#                                       0.17.x is a read-the-changelog bump, not
#                                       a date bump.
#   livekit-agents /          1.6.10 -> 1.8.2 is 2026-09-15 (eligible
#   livekit-plugins-google              2026-10-15) and is a MINOR pair; move
#                                       the two together, never apart.
#   langfuse                  4.14.4 -> 4.15.3 is 2026-09-15, eligible
#                                       2026-10-15.
#   pytest 9.1.1, pytest-asyncio 1.4.0, httpx 0.28.1 are each the newest
#   release outright — nothing to wait for.
#
# Other pinned tools (NOT npm, NOT PyPI, NOT an action — easy to miss):
#   gitleaks 8.30.1, pinned with a sha256 of the linux_x64 tarball in
#   `.github/workflows/secret-scan.yml` (GITLEAKS_VERSION + GITLEAKS_SHA256)
#   and required on PATH by the pre-commit hook in `lefthook.yml`. Checked
#   2026-09-16 against `git ls-remote --tags`: 8.30.1 is the newest release
#   outright, so nothing to take. This pin had never appeared in a hold list
#   before 2026-09-16 — it was found by the pre-commit hook refusing to run,
#   not by the audit looking for it. ENUMERATE IT EVERY PASS: the version and
#   the sha256 move together, and relaxing the sha check is never the fix.
#
# Runtimes:
# - Node, held at 24.19.0 (re-verified 2026-09-16 against
#   https://nodejs.org/dist/index.json). 24.21.0 (2026-09-07) is now the newest
