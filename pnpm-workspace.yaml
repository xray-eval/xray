#   on that date is 1.4.0 alone. Note the previous pass wrote 1.4.0 as
#   published 2026-08-20 and so dated this 2026-09-19; the tag's own commit
#   date is 2026-08-19. One day, but re-resolve rather than trusting the note.
#
# - python base image for the two example Dockerfiles, held at
#   `python@sha256:d50fb761…` = 3.12.13-slim-bookworm, built 2026-07-14
#   (re-verified 2026-09-16). This is the one pinned digest in the repo that
#   drifts from its tag continually — the tag is rebuilt on the upstream
#   debian:bookworm-slim cadence. It resolved to `sha256:0f5b26b9…` on
#   2026-08-26 and to `sha256:782412e8…` on 2026-09-02; today it STILL reads
#   `sha256:782412e8…`, unchanged in two weeks, pushed 2026-09-01. That makes
#   the target 15 days old, so it is past the 7-day gate and short of the
