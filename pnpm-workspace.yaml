  ignoreGhsas:
    # GHSA-fc5q-39xc-vjpf (high) — picomatch <=4.0.7: ReDoS when COMPILING a
    # single-branch repeated extglob pattern such as `+(*)` or `+(*a)`
    # (analyzeRepeatedExtglob skips them). Published 2026-10-19. Reason 2: the
    # advisory's range is `last_affected: 4.0.7` with `patched_versions: null`
    # / `patched_versions_unpublished`, 4.0.7 (2026-08-24) is picomatch
    # `latest`, and `git ls-remote --tags https://github.com/micromatch/picomatch`
    # shows no tag past 4.0.7. Nothing to upgrade or override to. Both copies
    # were still taken to the newest release in their line (`pnpm update
    # picomatch --depth Infinity`: 4.0.5 -> 4.0.7; 2.3.2 is already the newest
    # 2.x). NOT AFFECTED:
    #   - Dev-only. picomatch 2.3.2 arrives only as `react-cosmos >
    #     [http-proxy-middleware >] micromatch@4.0.8 > picomatch` (react-cosmos
    #     7.4.1 exact-pins micromatch 4.0.8), and 4.0.7 only through `vite`
    #     (directly and
    #     via tinyglobby / fdir) under vitepress. Neither is in the `--prod`
    #     image, and no prod dependency resolves picomatch at all.
    #   - Patterns are ours. The ReDoS fires on the PATTERN, not the subject.
    #     react-cosmos builds its patterns from cosmos.config.json; vite's come
    #     from the vitepress/vite config (`createFilter` include/exclude,
    #     `server.fs.deny`) and from `import.meta.glob` calls in source we ship
    #     — the docs build has none. A request path or a file path is only ever
    #     the string being matched.
    # DELETE when picomatch publishes a fix: micromatch declares
    # `picomatch ^2.3.1` and vite / tinyglobby / fdir declare `^4.0.x`, so
    # `pnpm update picomatch --depth Infinity` then reaches a 2.x / 4.x fix
    # unaided (an upstream fix only on a 5.x line would need an override
    # instead). Re-check `npm view picomatch time` every pass. Added
    # 2026-11-18, with its twin in supply-chain.yml `allow-ghsas`.
    - GHSA-fc5q-39xc-vjpf

# Source patches to installed packages (`pnpm patch` / `pnpm patch-commit`).
# Same bar as an override: a dated reason and the condition that deletes it.
#
# @tanstack/router-core — makes dev HMR work under Bun (src/server/main.ts
# sets `hmr: true` because of it). Bun's HMR runtime hands `null` to a module
# that reads an import cycle at top level (oven-sh/bun#40248, reported for
# TanStack as #40378); router-core's `router.js` imports `load-client.js`,
# which imports `router.js` back, and `router.js` reads `replaceRouteChunk`
# off it at load time to set `RouterCore.prototype._replaceRouteChunk`. The
# patch wraps that one assignment (ESM and CJS builds) in an arrow function,
# so the import is read when the method is CALLED, after both modules have
# loaded. Same behaviour, one line per build. The CJS half also silences
# Node's circular-access warning (TanStack/router#8585).
# Verified 2026-11-18 on bun 1.4.3: with `hmr: true` the SPA loads with no
# console errors, and editing src/client/router/root-layout.tsx swaps the
# text in place with no full reload and no errors. Unpatched, the same setup
# fails on load on bun 1.4.3 AND 1.4.4. Upgrading TanStack does not help: the
# newest router-core (1.171.39) still has the cycle.
# The key is the exact version, so EVERY router-core bump must re-create the
# patch (`pnpm patch @tanstack/router-core@<new>`, edit the two lines,
# `pnpm patch-commit`), or the install fails. DELETE when Bun ships
# oven-sh/bun#40259 (two-phase ESM linking in the dev server; green CI, awaiting
# review as of 2026-11-18) or router-core breaks the cycle — then re-test
# `hmr: true` without it. Added 2026-11-18.
patchedDependencies:
  '@tanstack/router-core@1.171.38': patches/@tanstack__router-core@1.171.38.patch

