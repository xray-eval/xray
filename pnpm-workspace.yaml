# Supply-chain hardening — see .claude/rules/supply-chain.md (section 1).
# Do NOT relax these without reading that rule first.

# Refuse to resolve packages younger than 7 days (10080 minutes).
# Catches the high-risk window right after a maintainer-account compromise.
minimumReleaseAge: 10080
# Fail loudly when a target version is too new — never silently downgrade.
minimumReleaseAgeStrict: true

# No minimumReleaseAgeExclude entries. The cooldown bypass is this repo's
# primary Shai-Hulud defence; the only entry that ever existed (brace-expansion,
# added 2026-08-01) reached its delete date and was resolved by upstream.

# Default-deny lifecycle scripts. Audit before adding entries here.
allowBuilds:
  # lefthook (Evil Martians) — postinstall resolves the prebuilt Go binary out of
  # the platform-specific optional dep (`lefthook-<os>-<arch>`, pinned to the
  # exact parent version and resolved by pnpm under the same cooldown + registry
  # rules) and runs `lefthook install`. No network access of its own: the whole
  # package contains zero fetch/download code. Required for the git hooks to
  # function. Audited 2026-07-29 against `postinstall.js` + `get-exe.js` @ v2.1.9.
  lefthook: true
  # msw — postinstall is a no-op unless `msw.workerDirectory` is set in our
  # package.json (it isn't; we're Node-only, no browser service worker). The
  # script wraps its body in `.catch(() => void 0)`. Audited 2026-07-29 against
  # `node_modules/msw/config/scripts/postinstall.js` @ v2.14.6.
  msw: true
  # esbuild — pulled in transitively by the dev build tooling (`drizzle-kit` for
  # migration generation, and `tsx` under both drizzle-kit and the VitePress
  # vite). The postinstall script selects the platform-specific binary subpackage
  # (e.g. @esbuild/linux-x64) — a regular npm package pnpm has already resolved
  # with cooldown rules — and falls back to downloading the tarball from
  # registry.npmjs.org over HTTPS, SHA-256-checking the bytes before exec, if the
  # optional dep was skipped. Both paths source from the same registry pnpm
  # already trusts. esbuild has provenance attestation + Sigstore signature.
  # Audited 2026-07-29 against `node_modules/.pnpm/esbuild@0.28.1/node_modules/esbuild/install.js`.
  esbuild: true
  # bun — pulled in as a peer of `bun-plugin-tailwind` (the Tailwind v4
  # plugin for Bun's HTML bundler). The npm `bun` package is *only* installed
  # to satisfy that peer; at runtime everything uses the system bun on
  # PATH. The postinstall (`install.js`) loads the platform-specific binary
  # subpackage `@oven/bun-<platform>-<arch>` (already resolved by pnpm with
  # cooldown rules), or falls back to `registry.npmjs.org/@oven/<pkg>/-/<pkg>-1.3.13.tgz`
  # over HTTPS — same registry/trust boundary pnpm already enforces. Same
  # pattern as esbuild above. Without this, the system `bun` errors at
  # startup when it detects an incomplete `node_modules/bun` sibling.
  # Audited 2026-05-16 against
  # `node_modules/.pnpm/bun@1.3.13/node_modules/bun/install.js`.
  bun: true
  # msgpackr-extract — pulled in transitively by bunqueue (via msgpackr for
  # the queue's binary serialization). The install script is
  # `node-gyp-build-optional-packages`, which looks for a prebuilt binary in
  # platform-specific subpackages (e.g. `@msgpackr-extract/msgpackr-extract-darwin-arm64`)
  # already resolved by pnpm under the same cooldown + registry rules as
  # the parent. Falls back to a local node-gyp build from C++ source if no
  # platform prebuilt is found. Same trust pattern as esbuild/bun above.
  # msgpackr also has a pure-JS fallback if msgpackr-extract is absent;
  # allowing the build just buys the native accelerator. Audited 2026-05-20
  # against `node_modules/.pnpm/msgpackr-extract@3.0.3/node_modules/msgpackr-extract/package.json`.
  msgpackr-extract: true

# Reinforce the v11 default in case it ever changes upstream.
strictDepBuilds: true

# No transitive deps from git URLs or raw tarballs — registry only.
blockExoticSubdeps: true

# Fail install if a newer release has weaker publish-time trust than the prior one.
trustPolicy: no-downgrade

# Re-verify node_modules matches the lockfile before any script runs.
verifyDepsBeforeRun: install

# Transitive-dep overrides. Each entry needs a date + reason — same bar as
# `allowBuilds` above. Keep the path as specific as possible so the override
# disappears the moment the upstream chain is fixed.
#
# TWO entries remain, down from six. Both were re-verified on 2026-09-23 the
# only way that proves anything: deleted, reinstalled, audited.
# `@esbuild-kit/core-utils>esbuild` brings GHSA-67mh-4wv8-2f99 straight back
# when removed, and dropping `vite` fails the install outright on
# `trustPolicy: no-downgrade` before the audit even runs. So neither is a habit
# nobody rechecked.
#
# The standing bias of this block is that an override is a WORKAROUND, not a
# fix: it is what you write when no installable upgrade reaches a patched
# version, and it is deleted the moment one does. Three passes running, an
# entry has left this list by being resolved upstream rather than by expiring:
#   - `ajv>fast-uri` (removed 2026-09-09) was never needed; ajv's own range
#     already allowed the patched 3.1.6 and the override was only compensating
#     for a stale lockfile. `pnpm update fast-uri --depth Infinity` was the fix.
#   - `react-cosmos>ws`, `react-cosmos>http-proxy-middleware`, `express>qs` and
#     `body-parser>qs` (all removed 2026-09-23) were fixed at the source by
#     react-cosmos 7.4.0 — see the note where they used to sit, below.
# When you add one, write the condition that deletes it, then check that
# condition on every pass.
overrides:
  # GHSA-67mh-4wv8-2f99 — esbuild <=0.24.2 lets any website hit the dev server
  # via permissive CORS. drizzle-kit ships the deprecated `@esbuild-kit/*`
  # packages which hard-pin esbuild ~0.18.20. We only invoke drizzle-kit for
  # `db:generate` / `db:studio` (no dev-server exposure), so the practical risk
  # is nil — but `pnpm audit --audit-level=moderate` (supply-chain CI job)
  # rejects it. ^0.25.0 dedupes onto the esbuild 0.25.x that drizzle-kit itself
  # already declares (`esbuild ^0.25.4`), so this adds zero new versions —
  # pinning ^0.28.1 here would instead add a third copy for no audit gain, since
  # 0.25.x carries no open advisory. Remove once drizzle-kit drops
  # `@esbuild-kit/*`. Added 2026-05-16, re-verified 2026-09-23 by deleting it
  # and reinstalling: GHSA-67mh-4wv8-2f99 comes straight back on
  # `.>drizzle-kit>@esbuild-kit/esm-loader>@esbuild-kit/core-utils>esbuild`.
  # drizzle-kit 0.31.10 still ships `@esbuild-kit/*`. Note 0.31.11 landed
  # 2026-09-21 and is the first movement on this package since 2026-03-17 —
  # it is two days old, so it is not installable yet; re-check on 2026-10-21
  # whether it drops `@esbuild-kit/*` and lets this entry go. esbuild 0.28.x
  # arrives via tsx/vite and carries no open advisory; raising this entry to
  # it would add a third esbuild copy for no audit gain, which is why it says
  # ^0.25.0 rather than ^0.28.1 (it dedupes onto the 0.25.12 drizzle-kit
  # already resolves — confirmed by `pnpm why esbuild` on 2026-09-23).
  "@esbuild-kit/core-utils>esbuild": "^0.25.0"
  # GHSA-fx2h-pf6j-xcff / GHSA-4w7w-66w2-5vf9 / GHSA-v6wh-96g9-6wx3 — vite
  # <=6.4.2 has a `server.fs.deny` bypass via Windows alternate paths, a path
  # traversal in optimized-deps `.map` handling, and (via launch-editor) an
  # NTLMv2 hash disclosure over UNC paths. All three are dev-server-only and the
  # first and third are Windows-only, so none is reachable from our static docs
  # build — but they are patched only in vite >=6.4.3, and vitepress@1.6.4
  # declares `vite ^5.4.14`, so the chain cannot reach a patched version on its
  # own. vite 5.4's bundled esbuild ~0.21.5 additionally trips
  # GHSA-67mh-4wv8-2f99.
  #
  # These four were suppressed via `auditConfig.ignoreGhsas` until 2026-07-29 on
  # the reasoning that vitepress had no stable release off vite 5. That reasoning
  # only ever justified *not moving vitepress*; it did not rule out moving vite
  # underneath it. Forcing vite 7.3.6 (published 2026-06-25, past both the 7-day
  # `minimumReleaseAge` gate and our 30-day proactive-upgrade bar) clears all
  # four advisories outright and lets the ignore list be deleted entirely.
  #
  # This is deliberately OUTSIDE vitepress@1.6.4's declared `vite ^5.4.14` range,
  # so it is verified by build rather than by semver: `pnpm docs:build` renders
  # all 7 pages, and the tag-stripped prose (SHA-256 over the HTML with <script>
  # and <style> removed, so bundler-generated content hashes don't count) is
  # byte-identical to the vite 5.4.21 build. vite 6.4.3 also builds clean; vite
  # 8.1.0 builds but warns that vitepress calls the deprecated
  # `transformWithEsbuild`, which is why this pins the 7.x line, not 8.x.
  # Exact-pinned, not caret: a vite major that vitepress does not sanction must
  # move on a deliberate, re-verified bump, never by drifting on `pnpm update`.
  # Remove once vitepress ships a stable release on vite >=6.4.3 (its 2.x line;
  # only a 2.0.0-alpha exists today). Added 2026-07-29, re-verified 2026-09-23:
  # vitepress is still 1.6.4 (its `next` tag is still 2.0.0-alpha.20, unmoved
  # since the last pass) and 7.3.6 is still the newest 7.x — the line has not
  # moved since 2026-06-25, while `latest` has gone on to 8.3.0. `pnpm
  # docs:build` on this pin renders all 7 pages clean.
  #
  # Second, independent reason this entry is now load-bearing: without it the
  # install does not merely regress the audit, it FAILS. vitepress's own range
  # resolves vite 5.4.21, which trips `trustPolicy: no-downgrade` above —
  # `ERR_PNPM_TRUST_DOWNGRADE ... earlier versions had trusted publisher, but
  # this version has provenance attestation`. So removing this entry would mean
  # relaxing a supply-chain gate, not just accepting an advisory. Re-confirmed
  # 2026-09-23 by deleting the entry: the install still dies on that exact
  # error for vite@5.4.21, before the audit ever runs.
  vite: "7.3.6"
  # The four entries that used to sit here — `react-cosmos>ws`,
  # `react-cosmos>http-proxy-middleware`, `express>qs` and `body-parser>qs` —
  # are GONE as of 2026-09-23, resolved at the source rather than expired.
  # They existed because react-cosmos 7.3.0 declared its server-side deps as
  # **exact** versions (`express 4.22.1`, `http-proxy-middleware 3.0.5`,
  # `ws 8.19.0`), and an exact pin means pnpm can never reach a patched
  # release on its own no matter how long we wait. react-cosmos 7.4.0
  # (2026-08-17) moves to `ws 8.21.3`, `http-proxy-middleware 3.0.7` and
  # `express 5.2.1` (whose `qs ^6.14.0` reaches the patched 6.16.0 unaided),
  # which clears all five advisories the four entries were holding down:
  # GHSA-58qx-3vcg-4xpx + GHSA-96hv-2xvq-fx4p (ws), GHSA-gcq2-9pq2-cxqm +
  # GHSA-64mm-vxmg-q3vj (http-proxy-middleware), and GHSA-q8mj-m7cp-5q26 /
  # GHSA-x5fp-wj9c-mxmx / GHSA-4mjr-xmp4-gh2g (qs).
  #
  # Verified 2026-09-23 the same way they were always verified: deleted all
  # four, reinstalled on react-cosmos 7.4.0, and `pnpm audit
  # --audit-level=moderate` reports "No known vulnerabilities found". The
  # resolved tree is `http-proxy-middleware 3.0.7`, `qs 6.16.0`,
  # `express 5.2.1`, and ws at 8.21.3 (react-cosmos) + 8.21.0 (happy-dom).
  # Those are two ws copies where the old exact-pinned override kept one —
  # deliberately not re-added, because both copies are patched and an
  # override with no advisory behind it is exactly the habit this block
  # exists to avoid. `pnpm cosmos` was re-run on 7.4.0 (which carries four
  # internal majors: express 4->5, chokidar 3->5, yargs 17->18, open 10->11)
  # and still serves the playground on :5050 and the renderer on :5051, both
  # 200, with all 11 fixtures discovered.

# VEX-style "not affected" dispositions. THE LIST IS EMPTY, and the note below
# is the standing policy for the day it isn't.
#
# There is exactly ONE structural reason an entry may be added here, and it is
# not "we'd rather not upgrade": the patched release is inside the 7-day
# `minimumReleaseAge` cooldown, so there is no version pnpm is allowed to
# install that clears the finding. Bypassing the cooldown with
# `minimumReleaseAgeExclude` would be the wrong trade — that gate is this repo's
# primary Shai-Hulud defence (see .claude/rules/supply-chain.md) — so for an
# advisory that is genuinely unreachable here, suppressing it for a few days is
# strictly safer than installing a package that is days old. Every entry names
# the date it converts into a real upgrade; on that date, delete the entry and
# bump. Do not let one outlive its date.
#
# What is NOT a reason to add an entry: a patched release that is merely younger
# than the 30-day proactive bar. That bar says "upgrade even when the audit is
# green"; it is a floor on staleness, never a ceiling on a security fix. The
# 2026-09-09 pass is the worked example — hono <4.13.5 opened three advisories
# and the fix, 4.13.5, was 14 days old: past the 7-day gate, short of 30. It was
# taken as a real upgrade the same day rather than suppressed.
#
# Every entry this file has ever carried is gone, each resolved by an upgrade
# rather than by expiry: the fast-uri/hono pair (added 2026-08-04) on
# 2026-08-11, and the qs pair (GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g, added
# 2026-09-03) on 2026-09-06 by bumping the `express>qs` override to "6.16.0".
# Re-confirmed empty on 2026-09-23: `pnpm audit --audit-level=moderate` passes
# with nothing suppressed, so there is no advisory this list could be hiding.
# The 2026-09-23 pass also retired the last four overrides those qs entries
# fed into — see the overrides block above — so the whole qs chain is now
# resolved at the source with neither a suppression nor an override behind it.
#
# If an entry ever comes back: EVERY ENTRY NEEDS A TWIN in `allow-ghsas` on the
# dependency-review step of .github/workflows/supply-chain.yml, because that
# action reads GitHub's advisory DB directly and never looks at this file. Add
# and delete in both places on the same commit, or `pnpm audit` and the
# `Supply-chain audit` job disagree.

# Deliberate version holds — packages whose newest release is NOT the one
# pinned in package.json. Two different reasons live here, and the entry says
# which: either the release is simply younger than the 30-day proactive bar
# (the ordinary case — not a hold, just the bar), or it is 30-day-eligible and
# we are deliberately NOT taking it because it is broken or wrong for us (a
# real hold). No pnpm setting enforces either, so the note is the only thing
# keeping the pin honest. Each entry names the version and the date it becomes
# installable, so the next audit converts it instead of rediscovering it.
#
# Converted by the 2026-09-23 pass and therefore GONE from this list:
#   - react-cosmos / -core / -dom 7.3.0 -> 7.4.0, which deleted FOUR overrides
#     at the source (see the overrides block above). 7.4.1 exists for
#     react-cosmos only and is 22 days old, so all three stay on 7.4.0 and on
#     the same minor; take 7.4.1 on 2026-09-30 if -core / -dom have caught up.
#   - bun 1.3.14 -> 1.4.0 in `.tool-versions` + both Dockerfile digests.
#   - sounddevice 0.5.5 -> 0.5.6 in `sdk/python/pyproject.toml`.
#   - The two GitHub Actions whose dates had come due: harden-runner
#     v2.20.1 -> v2.21.0 and docker/setup-buildx-action v4.2.0 -> v4.3.0.
#
# - @hono/standard-validator, held at 0.2.3 (re-verified 2026-09-23). NOT
#   date-gated on its own account: 0.3.0 (2026-07-15) and 0.4.0 (2026-08-05)
#   both clear the 30-day bar, but `hono-openapi@1.3.1` declares
#   `@hono/standard-validator ^0.2.0` as an optional peer, so anything from
#   0.3.0 up leaves the range its only consumer sanctions. Nothing in `src/`
#   imports this package by name; it is a direct dependency purely because
#   `hono-openapi/dist/index.js` statically imports `sValidator` from it and an
#   *optional* peer is not installed unless we declare it.
#
#   The exit is a DELETION, not a bump. hono-openapi 1.3.2 (2026-09-06)
#   promotes `@hono/standard-validator` to a REAL dependency at `^0.4.0` and
#   drops it from `peerDependencies`, which removes the only reason we list it
#   at all — pnpm would then install it unasked, at a version hono-openapi
#   itself sanctions, and our declaration would be a second pin on someone
#   else's dependency. 1.3.2 is 17 days old today and 1.3.3 (2026-09-13) is 10;
#   1.3.2 clears the 30-day bar on 2026-10-06, 1.3.3 on 2026-10-13.
#   ON 2026-10-06: BUMP hono-openapi TO WHICHEVER 1.3.x IS THEN ELIGIBLE AND
#   DELETE THE `@hono/standard-validator` ENTRY FROM package.json's
#   `dependencies`. Verify with `pnpm why @hono/standard-validator` (it must
#   still be present, as hono-openapi's own dep) plus `pnpm typecheck` —
#   nothing imports it by name, so a green typecheck is the whole proof.
#
# - Node, held at 24.19.0 (re-verified 2026-09-23 against
#   https://nodejs.org/dist/index.json). This is the bar, not a hold: 24.20.0
#   (2026-08-26) is 28 days old — two days short — and 24.21.0 (2026-09-07) is
#   16. Neither is a security release (`"security": false` in that index, which
#   is the field this check reads), so there is no reason to take one early.
#   24.20.0 is still the current Latest LTS line head for our purposes.
#   BUMP TO 24.20.0 ON 2026-09-25 (or to 24.21.0 on 2026-10-07 if the next
#   pass lands after that), or immediately if a security release supersedes.
#   Remember `.nvmrc` and `.tool-versions` both carry it.
#
# - bun: NO LONGER HELD. Taken to 1.4.0 on 2026-09-23 (published 2026-08-20,
#   33 days). `.tool-versions`, `Dockerfile` and `Dockerfile.dev.server` all
#   move together — the image digest is `oven/bun:1.4.0-debian` =
#   `sha256:5bb0f9be…`, resolved from the registry on the bump date. The full
#   suite (1393 tests), `pnpm build` and `pnpm cosmos` were re-run on 1.4.0.
#   `@types/bun` moved to 1.4.0 in the same pass so the types match the
#   runtime. 1.4.1 (2026-09-04) and 1.4.2 (2026-09-05) are younger than the
#   bar; 1.4.1 becomes eligible 2026-10-04.
#
# - python base image for the two example Dockerfiles. The pin moved on
#   2026-09-23 from `sha256:d50fb761…` to `sha256:4766d8b5…`, and the comment
#   in both Dockerfiles now names `3.12.13-slim-bookworm` rather than the
#   floating `3.12-slim-bookworm`, because THE TWO TAGS HAVE DIVERGED and only
#   the patch tag is takeable. Concretely, on the bump date:
#     3.12-slim-bookworm     = sha256:392307d2…, pushed 2026-09-19 (4 days)
#     3.12.13-slim-bookworm  = sha256:4766d8b5…, pushed 2026-08-05 (49 days)
#   The floating tag is rebuilt on the upstream debian:bookworm-slim cadence,
#   so it is almost always inside the cooldown when an audit looks at it —
#   that is why every previous pass found it ineligible and deferred. The
#   patch tag is rebuilt far less often, which is exactly what makes it
#   eligible, and it is a rebuild of the same Python patch level the pin has
#   always meant, so taking it is a Debian security refresh and nothing else.
#   Keep pinning the PATCH tag from here on; re-resolve it rather than pasting
#   any digest written here, since it drifts. Re-check on 2026-10-19 (when
#   today's floating digest ages in) whether the 3.12 line has settled and the
#   two tags agree again.
#
# - GitHub Actions. Every `uses:` is SHA-pinned (supply-chain.md §4) and moves
#   on the same 30-day bar as everything else, evaluated per action against its
#   own release dates. The 2026-09-23 pass converted the two that had come due:
#   harden-runner v2.20.1 -> v2.21.0 (13 refs across 9 workflows) and
#   docker/setup-buildx-action v4.2.0 -> v4.3.0.
#
#   Still held, with the date each becomes eligible:
#     step-security/harden-runner      v2.21.0 -> v2.21.1 (2026-08-30) 2026-09-29
#     anchore/sbom-action              v0.24.0 -> v0.24.2 (2026-08-28) 2026-09-27
#     docker/setup-qemu-action         v4.2.0  -> v4.3.0  (2026-09-01) 2026-10-01
#     actions/deploy-pages             v5.0.0  -> v5.0.1  (2026-09-01) 2026-10-01
#     docker/build-push-action         v7.3.0  -> v7.4.0  (2026-09-15) 2026-10-15
#     docker/setup-buildx-action       v4.3.0  -> v4.4.0  (2026-09-15) 2026-10-15
#                                              -> v4.4.1  (2026-09-16) 2026-10-16
#     docker/setup-qemu-action         v4.3.0  -> v4.4.0  (2026-09-15) 2026-10-15
#   (anchore v0.24.1 is 2026-08-27; take the newest eligible in the major on
#   the bump date, not the first row.)
#
#   docker/build-push-action v7.4.0 was NOT in the previous pass's list, which
#   is the second time a docker/* row has been missed — same failure the
#   previous pass warned about. The enumeration is mechanical, so DO IT
#   MECHANICALLY: `git ls-remote --tags https://github.com/<owner>/<repo>` for
#   all 19 pinned actions, diff every newest in-major tag against the pin, and
#   never re-read this list and check only the rows it already names. A hold
#   list can only go stale in the direction of under-reporting.
#
#   Majors are NOT taken on the date bar alone — actions/cache v6,
#   actions/checkout v7, actions/setup-node v7 and astral-sh/setup-uv v9/v10
#   are all 30-day-eligible but stay on their current major until someone
#   reviews the major's changelog deliberately. That matches how this repo has
#   always moved actions; note actions/cache and actions/checkout both still
#   ship backport releases on the current major, so staying put is not the same
#   as going stale.
#
#   SHA-drift check: all 19 pinned SHAs were re-resolved to tags on 2026-09-23
#   and every one matches the tag its comment claims. (The 2026-09-02 pass
#   found `actions/upload-artifact` mislabelled `# v6.0.0` when the SHA was
#   v7.0.1; that fix has held.) Re-run this every audit — a wrong tag comment
#   silently defeats the audit trail the SHA pin exists to provide.
#
#   How to run both checks without the GitHub API (it is not always reachable
#   from an audit session, and `releases.atom` is not either):
#   `git ls-remote --tags https://github.com/<owner>/<repo>` maps every tag to
#   a SHA, covering both the drift check and "newest tag in this major". For
#   the release DATE a tag needs — the input to the 30-day bar —
#   `git clone --depth 1 --branch <tag>` then `git log -1 --format=%cI` reads
#   the tag's commit date, which for these repos is the release date.
#
# - Python, non-SDK. The example pins (`examples/livekit-voice-agent/*`) move
#   on the same bar and must stay identical between each slice's `Dockerfile`
#   and its `pyproject.toml` (supply-chain.md §6). Taken 2026-09-23:
#   livekit-agents + livekit-plugins-google 1.6.9 -> 1.7.0, langfuse
#   4.14.3 -> 4.14.4. Held (younger than the bar): livekit-agents 1.8.2
#   (2026-09-15) eligible 2026-10-15; langfuse 4.15.2 (2026-09-09) eligible
#   2026-10-09. pytest 9.1.1 / pytest-asyncio 1.4.0 / httpx 0.28.1 are all
#   still the newest release. NOTE: nothing in CI builds or runs the examples,
#   so a bump here has no automated signal behind it — verify by installing
#   the candidate set into a venv and exercising the API surface `agent/main.py`
#   actually touches (that is how 1.7.0 was checked: FunctionTool schema,
#   AgentSession + google.realtime.RealtimeModel construction,
#   ConversationItemAddedEvent, and `session.say(audio=...)`).
