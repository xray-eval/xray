# TypeScript typecheck gate — `tsc --noEmit` over the root project, plus the
# `cosmos/` workbench harness, which is a separate tsconfig project.
#
# lefthook.yml runs this in pre-commit, but a `git commit --no-verify` or a
# fork PR whose author never installed the hook can still push type drift.
# This workflow is the CI backstop the pre-commit hook can't be: types are
# checked on every PR and every push to main. Local equivalent: `pnpm typecheck`.
#
# No Setup-Bun step (unlike test.yml / build.yml): `tsc` is a Node tool, and
# the `bun` ambient types (tsconfig `types: ["bun"]`) come from the `@types/bun`
# dev dependency in node_modules after `pnpm install` — not from the Bun binary.

name: Typecheck

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: typecheck-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typecheck:
    name: tsc --noEmit
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1  # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # Corepack must run AFTER setup-node — same reasoning as test.yml.
      - name: Activate the pinned pnpm version via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Separate project: `cosmos/` sits outside the root tsconfig because its
      # fixture map is generated and gitignored. Without this step the workbench
      # harness is the one directory of TypeScript in the repo that nothing
      # typechecks — `pnpm typecheck` doesn't include it, and the pre-commit hook
      # only runs the root project.
      - name: Typecheck the component workbench
        run: pnpm typecheck:cosmos
