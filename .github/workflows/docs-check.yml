# Docs PR build-gate — compile-only check that the VitePress site still builds,
# so a broken docs build can't merge. No deploy and no Pages permissions: the
# deploy half lives in docs.yml (release tag / workflow_dispatch), kept separate
# so the deploy job never shows up as a skipped check on pull requests.
#
# Local equivalent: `pnpm docs:build`.

name: Docs check

on:
  pull_request:
    paths:
      - "docs/**"
      - ".github/workflows/docs-check.yml"
      - "pnpm-lock.yaml"
      - "package.json"

permissions: {}

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: vitepress build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ".nvmrc"

      # Corepack must run AFTER setup-node, so pnpm is activated by the corepack
      # bundled with the .nvmrc Node rather than the runner's preinstalled copy,
      # which can predate the pnpm release (pnpm >=11 needs corepack to know its
      # `bin/pnpm.mjs` entry point). package.json#packageManager is the source
      # of truth for the pnpm version corepack activates.
      - name: Activate the pinned pnpm version via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Install (frozen lockfile)
        run: pnpm install --frozen-lockfile

      # Base path (/xray/) is hardcoded in docs/.vitepress/config.mts.
      - name: Build docs
        run: pnpm docs:build
