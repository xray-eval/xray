# Supply-chain audit — see .claude/rules/supply-chain.md (section 2).
# Runs on every PR, every push to main, and daily on a schedule (to catch
# advisory-DB drift — see the `schedule` trigger below). Don't add
# `workflow_dispatch` without thinking about who can manually trigger and skip
# checks.

name: Supply chain

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # pnpm audit is time-sensitive: a newly-disclosed advisory can flip a commit
    # that was green to red with no new push. A daily run surfaces that drift on
    # main proactively instead of at release time. Issue #109.
    - cron: "17 6 * * *"

# Default-deny — each job re-grants only what it needs.
permissions: {}

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Supply-chain audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write  # dependency-review-action comments on PRs

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          # Start in audit mode to learn the egress profile, then flip to `block`
          # with an allowed-endpoints list once stable.
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          persist-credentials: false

      - name: Setup Node (pinned via .nvmrc)
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38  # v6.5.0
        with:
          # Single source of truth: .nvmrc (mirrored from .tool-versions).
          # Floating major like '22' would silently take a new patch on each
          # run — exactly the dependency-injection vector we're closing.
          node-version-file: '.nvmrc'

      # Corepack must run AFTER setup-node: current pnpm (11.x) requires
      # Node ≥22.13, and the runner's pre-installed Node is older than that.
      # package.json#packageManager is the source of truth for the pnpm
      # version corepack activates.
      - name: Activate the pinned pnpm version via corepack
        run: |
          corepack enable
          corepack prepare --activate
          pnpm --version

      # Cache the pnpm content-addressed store. `cache: 'pnpm'` on setup-node
      # can't be used here because it needs pnpm on PATH when setup-node runs,
      # and pnpm only becomes available after corepack (above) — which itself
      # needs the pinned Node first.
      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25  # v5.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - name: Frozen-lockfile install
        # --frozen-lockfile fails if pnpm-lock.yaml is out of sync with package.json.
        # It also enforces every security setting in pnpm-workspace.yaml:
        # minimumReleaseAge, allowBuilds (deny), blockExoticSubdeps, trustPolicy, etc.
        run: pnpm install --frozen-lockfile

      - name: Audit known vulnerabilities (fail on moderate+)
        run: pnpm audit --audit-level=moderate

      - name: Reject exotic or non-registry resolutions in the lockfile
        # blockExoticSubdeps already prevents this at install time; this is a
        # belt-and-braces check on the *committed* lockfile so a future config
        # relaxation can't sneak in a tarball/git resolution unnoticed.
        run: |
          set -euo pipefail
          if [ ! -f pnpm-lock.yaml ]; then
            echo "::error::pnpm-lock.yaml missing — every commit must include it"
            exit 1
          fi
          if grep -nE '^\s*resolution:\s*\{\s*(tarball|repo|directory):' pnpm-lock.yaml; then
            echo "::error::Lockfile contains exotic resolutions (tarball/repo/directory)"
            exit 1
          fi
          if grep -nE '^\s*registry:\s*' pnpm-lock.yaml | grep -vE 'registry\.npmjs\.org'; then
            echo "::error::Lockfile references a non-npmjs registry"
            exit 1
          fi

      - name: Dependency review (PR only — fails on new vulnerable / disallowed-license deps)
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: moderate
          # Mirror of `auditConfig.ignoreGhsas` in pnpm-workspace.yaml. This
          # action keeps its own allowlist and does NOT read pnpm's config, so a
          # suppression has to be written in BOTH places or the two gates
          # disagree — `pnpm audit` passes while this step fails the moment a PR
          # re-resolves the affected package. The reachability analysis for each
          # entry lives in pnpm-workspace.yaml; it is deliberately not duplicated
          # here, so that there is one place to read and two places to delete.
          #
          # No allow-ghsas entries: the fast-uri/hono pair (added 2026-08-05)
          # reached its cooldown dates and was fixed by real upgrades on
          # 2026-08-11; the qs pair (added 2026-09-03) reached its cooldown
          # date and was fixed by a real upgrade on 2026-09-06. Any new entry
          # needs a twin in pnpm-workspace.yaml `auditConfig.ignoreGhsas` on
          # the same commit.
          # ELv2-redistributable bundle: reject every copyleft family on any
          # new prod dep. The SPA is built with Bun's HTML bundler, which
          # inlines JS into single output chunks — so even weak-copyleft
          # licenses (LGPL §6, MPL §3.3, EPL §3) would trigger
          # source-availability obligations on the bundle itself. SPDX
          # expressions must be enumerated explicitly; the action does not
          # glob. This is the single source of truth — NOTICE and LICENSE
          # reference this list rather than restating it.
          deny-licenses: >-
            GPL-1.0, GPL-1.0-only, GPL-1.0-or-later,
            GPL-2.0, GPL-2.0-only, GPL-2.0-or-later,
            GPL-3.0, GPL-3.0-only, GPL-3.0-or-later,
            LGPL-2.0, LGPL-2.0-only, LGPL-2.0-or-later,
            LGPL-2.1, LGPL-2.1-only, LGPL-2.1-or-later,
            LGPL-3.0, LGPL-3.0-only, LGPL-3.0-or-later,
            AGPL-1.0, AGPL-1.0-only, AGPL-1.0-or-later,
            AGPL-3.0, AGPL-3.0-only, AGPL-3.0-or-later,
            SSPL-1.0,
            MPL-1.0, MPL-1.1, MPL-2.0,
            EPL-1.0, EPL-2.0,
            CDDL-1.0, CDDL-1.1,
            EUPL-1.0, EUPL-1.1, EUPL-1.2,
            CC-BY-SA-1.0, CC-BY-SA-2.0, CC-BY-SA-2.5,
            CC-BY-SA-3.0, CC-BY-SA-4.0
          # dompurify is dual-licensed `MPL-2.0 OR Apache-2.0`; the deny-list
          # above matches the MPL-2.0 term, but the OR lets us take it under
          # permissive Apache-2.0, so no copyleft obligation attaches. It is also
          # a dev-only docs dep (mermaid → dompurify), dropped by the prod image's
          # `--prod` install and never inlined into the shipped SPA bundle — so
          # the bundle source-availability concern the deny-list guards cannot
          # arise here. Excluded from license checking by purl (version-agnostic,
          # so the planned 3.4.11 bump doesn't reopen it). Added 2026-06-21.
          allow-dependencies-licenses: pkg:npm/dompurify
          comment-summary-in-pr: on-failure
