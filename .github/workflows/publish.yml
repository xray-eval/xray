# Publish workflow — builds the Docker image and pushes to GHCR on tag push.
# See .claude/rules/supply-chain.md "What's not yet covered" for the design.
#
# Triggered ONLY by `v*` tags. Never on push to main, never on workflow_dispatch.
# A release is an explicit `git tag v0.1.0 && git push --tags` action.
#
# Every action is pinned to a 40-char commit SHA (supply-chain.md §4).
# Base image digests live in the Dockerfile (same rule).

name: Publish

on:
  push:
    tags:
      - "v*.*.*"

# Default-deny — each job re-grants the minimum.
permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false  # never cancel a publish in flight

jobs:
  publish:
    name: Build, push, sign, attest
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Exposed so the `release` job below can reference the pushed image digest
    # without holding any of this job's registry/signing permissions.
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    permissions:
      contents: read           # checkout
      packages: write          # push to ghcr.io
      id-token: write          # OIDC for cosign keyless + provenance attestation
      attestations: write      # actions/attest{,-build-provenance} persist attestations
      artifact-metadata: write # attest actions create the artifact storage record (issue #109)

    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}  # ghcr.io/<owner>/<repo>

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up QEMU (multi-arch builds)
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4.0.0

      - name: Log in to GHCR
        # GITHUB_TOKEN is short-lived and scoped to this workflow — no static PAT.
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4.1.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags + labels
        id: meta
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf  # v6.0.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          labels: |
            org.opencontainers.image.title=Voice Agent X-Ray
            org.opencontainers.image.description=Open-source self-hosted debugger for voice-agent workflows.
            org.opencontainers.image.licenses=Elastic-2.0

      - name: Build + push (multi-arch)
        id: build
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7.1.0
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance + SBOM attestations are attached below (separate steps,
          # using GitHub's first-party attest-* actions).
          provenance: false
          sbom: false

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2

      - name: Sign the image (cosign keyless via OIDC)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          # `cosign sign` over the digest pins us to the exact image bytes that
          # were just pushed — tag mutability is irrelevant.
          for tag in $TAGS; do
            cosign sign --yes "${tag}@${DIGEST}"
          done

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Generate SBOM (Syft, SPDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610  # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          # Don't auto-attach the SBOM as a GitHub Release asset — that needs
          # `contents: write` and this job only holds `contents: read` (default-min
          # per supply-chain.md). The canonical attestation path is the
          # `actions/attest` step below, which pushes the SBOM to GHCR as an OCI
          # artifact and doesn't touch the Release.
          upload-release-assets: false

      - name: Attest SBOM
        # actions/attest-sbom is deprecated (GitHub folded it into the generic
        # actions/attest, which takes `sbom-path` directly). Same inputs, same
        # SPDX attestation pushed to the registry. Issue #109.
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763  # v4.1.1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true

  # Create the GitHub Release only after the image is built, signed, and
  # attested. Isolated in its own job so `contents: write` — which creating a
  # Release requires — stays OFF the build/sign/attest job above (which holds
  # packages/id-token/attestations write). Least privilege per job. Issue #109.
  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write  # the ONLY grant — create the Release object, nothing else

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411  # v2.19.4
        with:
          egress-policy: audit

      - name: Checkout
        # Only here to resolve the previous release tag from git ancestry (see
        # the changelog comment below). fetch-depth: 0 because `git describe`
        # walks the commit graph — a shallow clone can't see prior tags.
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          IMAGE: ghcr.io/${{ github.repository }}
          DIGEST: ${{ needs.publish.outputs.digest }}
        run: |
          set -euo pipefail
          # Semver pre-release tags (…-alpha.N / -rc.N) publish as prereleases;
          # a bare vX.Y.Z publishes as Latest.
          case "$TAG" in
            *-*) REL=(--prerelease) ;;
            *)   REL=(--latest) ;;
          esac
          NOTES="$(printf '**Image:** `%s:%s` — multi-arch (amd64/arm64), cosign-signed (keyless OIDC), SLSA provenance + SPDX SBOM attested.\n**Digest:** `%s`' "$IMAGE" "${TAG#v}" "$DIGEST")"
          # Assemble the full body once so create and edit stay byte-identical.
          # gh's --generate-notes lives only on `create`, so an edit-path re-run
          # would silently drop the changelog; generate it via the same API and
          # append it ourselves instead.
          # Baseline the changelog on the previous tag by *ancestry*. Left to
          # itself, generate-notes picks the newest prior release by
          # `published_at` — and that ordering is permanently wrong here:
          # alpha.3's Release was backfilled two seconds after alpha.4's, so
          # alpha.3 looks newer forever and every changelog replays alpha.4's
          # PRs. Ancestry can't be reordered by a backfill.
          # `git tag --sort=-v:refname` is the obvious alternative and is a
          # trap: it sorts v0.1.0-alpha.1 ABOVE v0.1.0 unless versionsort.suffix
          # is configured, so it would break on the first stable release.
          # No predecessor (the very first tag) => omit the field and let
          # generate-notes fall back to its own default.
          PREV="$(git describe --tags --abbrev=0 --match 'v*.*.*' "$TAG^" 2>/dev/null || true)"
          NOTES_ARGS=(-f tag_name="$TAG")
          if [ -n "$PREV" ]; then
            NOTES_ARGS+=(-f previous_tag_name="$PREV")
          fi
          CHANGELOG="$(gh api "repos/$GH_REPO/releases/generate-notes" "${NOTES_ARGS[@]}" --jq '.body' 2>/dev/null || true)"
          BODY="$NOTES"
          if [ -n "$CHANGELOG" ]; then
            BODY="$NOTES"$'\n\n'"$CHANGELOG"
          fi
          # Idempotent: a re-run of a published tag rewrites the same body
          # (current digest + changelog) instead of failing.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes "$BODY" "${REL[@]}"
          else
            gh release create "$TAG" --title "$TAG" --notes "$BODY" --verify-tag "${REL[@]}"
          fi
